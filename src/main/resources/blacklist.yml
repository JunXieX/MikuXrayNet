# ===========================================================================
#  MikuXrayNet —— 世界黑名单（反矿透 + 带宽优化 共用）
# ---------------------------------------------------------------------------
#  作用：名单内的世界<b>同时豁免反矿透与带宽优化</b>两个模块的全部功能，
#        适合主城 / 副本 / 小游戏等「不想伪装、也不想省带宽」的地图。
#
#  本文件不会被插件回写；修改后执行 /mikuxraynet reload 即时生效（无需重启）。
#
#  【匹配规则】
#    · 名字支持精确匹配（spawn）与通配（dungeon_*，* 匹配任意字符序列，可为空）；
#    · 世界名大小写敏感（与「反矿透逐世界覆盖」的匹配语义一致）；
#    · 该世界同时命中精确名与通配时，任一命中即生效。
#
#  【生效范围】
#    · 命中世界：不做区块改写、不做邻近显形、不做事件即时显形、
#                不做零位移包取消 / 方块变更合并 / 实体剔除 / AFK 降级 / 高延迟降视距；
#    · 未命中世界：两个模块均照常工作。
#    整份名单改动会参与缓存指纹：新增/移除世界后，相关世界的磁盘缓存会自动失效重建（属正常现象）。
#
#  【优先级】本名单优先级高于 antixray.yml 的 world-overrides：
#    某世界既在本名单、又在 world-overrides 里启用了反矿透，仍以本名单为准（完全不生效）。
# ===========================================================================

# 世界名列表（默认空 = 所有世界都启用反矿透与带宽优化）。示例：
# world-blacklist:
#   - spawn                 # 主城
#   - dungeon_1             # 某个副本世界
#   - dungeon_*             # 所有副本世界
world-blacklist: []
