# ===========================================================================
#  MikuXrayNet —— 带宽优化配置
# ---------------------------------------------------------------------------
#  说明：本版本仅完成配置解析与校验，带宽模块尚未接入生效逻辑（里程碑 M5）。
#        为了让配置文件与文档一次成型，此处已给出全部规划中的开关与默认值。
#
#  本文件带完整中文注释，插件不会回写本文件。
# ===========================================================================

# 带宽优化总开关（M5 才会生效）。
enabled: false

entity-packets:
  # 取消「零位移」实体位置/朝向包（内容与上一包完全相同），可显著降低实体密集区带宽。
  skip-zero-movement: true

  # 白名单：这些实体类型即使零位移也照常下发（如盔甲架、展示框）。
  whitelist:
    - armor_stand
    - item_frame
    - glow_item_frame

block-changes:
  # 合并同一 tick 内的邻域方块变更，减少单方块变更包数量。
  merge: true

  # 合并邻域半径（曼哈顿距离），1~2 之间较安全。
  merge-radius: 2

  # 单个合并包允许包含的最大方块变更数。
  max-per-packet: 4096

  # 超出上限时，剩余变更是否拆分为后续包继续发送。
  resend-on-overflow: true

palette:
  # 重排调色板：把高频方块排到低位索引，提升位打包压缩率（与反矿透共用一次编码）。
  reorder: true

  # true 时对调色板重排结果做解码往返自检，失败即整模块降级为直通。
  strict-verify: false

entity-culling:
  # 依据视线射线剔除被完全遮挡的实体（对玩家自身、坐骑等始终放行）。
  raycast: true

  # 强制可见距离：该距离以内的实体不做剔除。
  force-visible-distance: 32.0

  # 射线剔除使用的线程数；0 表示按 CPU 核数自动推算（上限 2）。
  threads: 0

afk:
  # 玩家无操作超过该秒数即视为 AFK。
  seconds: 300

  # AFK 玩家的实体跟踪范围压缩到该距离（格）。
  distance: 16.0

latency:
  # 玩家平均延迟超过该阈值（毫秒）时触发降级。
  threshold-millis: 400

  # 高延迟玩家降低的视距（区块数）。
  reduce-view-distance: 2

diagnostics:
  # 诊断统计的输出间隔（秒）；0 表示不输出。
  interval-seconds: 60