# ===========================================================================
#  MikuXrayNet —— 带宽优化配置
# ---------------------------------------------------------------------------
#  说明：本文件控制「带宽优化」子模块（里程碑 M5 已接入生效逻辑）。
#        每个子模块都有自己的总开关 `enabled`：关闭后对应子模块「完全不注册」，
#        不建监听器、不起周期任务、不产生任何开销（不是「跑了但不生效」）。
#        所有子模块均为「失败即放行（fail-open）」：任何异常/超时都不会丢包。
#
#  本文件带完整中文注释，插件不会回写本文件。
# ===========================================================================

# 带宽优化总开关。关闭时以下所有子模块都不注册。
enabled: true

entity-packets:
  # 模块总开关。false 时本模块完全不注册（零开销）。
  enabled: true

  # 取消「零位移」实体位置/朝向包（位移与转向增量全为 0），可显著降低实体密集区带宽。
  # 本项是本模块的「行为开关」：总开关 enabled=true 时才生效。
  skip-zero-movement: true

  # 白名单：这些实体类型即使零位移也照常下发（如盔甲架、展示框）。
  # 实体类型索引只在主线程周期刷新；Folia 下无法安全枚举实体，该白名单暂不生效
  # （退化为对所有实体生效，只是保守性略降，不影响正确性）。
  whitelist:
    - armor_stand
    - item_frame
    - glow_item_frame

block-changes:
  # 模块总开关。false 时本模块完全不注册（零开销）。
  enabled: true

  # 合并同一玩家短时间内的邻域方块变更，减少单方块变更包数量。
  # 本项是本模块的「行为开关」：总开关 enabled=true 时才生效。
  merge: true

  # 合并邻域半径（曼哈顿距离），1~2 之间较安全。
  merge-radius: 2

  # 单个合并包允许包含的最大方块变更数。
  max-per-packet: 4096

  # 超出上限时，剩余变更是否拆分为后续包继续发送（false 则本次放弃合并、原包照常放行）。
  resend-on-overflow: true

  # 合并时间窗（毫秒）：窗口内到达的变更会被延迟到窗口到期合并发送。
  # 越小越实时、越大越省带宽；建议 20~100。
  # 默认 20（原为 50）：窗口越大，「挖掘/放置」后客户端等方块更新的时间越长，越容易察觉顿感。
  # 说明：真正的交互延迟由下面的 immediate-radius 消除；本项只影响「较远处」变更的批量收益。
  merge-window-millis: 20

  # 每个玩家的待发缓冲条目上限；达到上限立即冲刷，避免缓冲无界增长。
  max-pending-entries: 256

  # 立即放行半径（格，三维欧氏距离，0 = 关闭即全部走合并）。
  # 玩家周围该半径内的方块变更「不进合并窗口、原包立即放行」，因此不影响客户端预测与交互实时性；
  # 半径外的变更（爆炸、大面积刷新等）照常合并，保住省包收益。
  # 默认 8：玩家挖方块/放方块时目标就在脚边 1~2 格，被窗口延迟会造成明显的挖掘顿感；
  #           取值越大越顺滑、但合并收益越低（建议 4~12）。
  immediate-radius: 8

palette:
  # 模块总开关。false 时本模块完全不生效（反矿透编码链路取 DISABLED，零开销）。
  enabled: true

  # 回显口径提示：/mxnet status 会把「模块开关」与下面的 reorder 合成一句无歧义中文，例如
  #   「调色板重排 关闭（模块启用但 reorder=false，不做任何重排）」——
  # 避免只看到 enabled=true 就误以为「重排已启用」（真正决定重排的只有 reorder）。

  # 重排调色板：把高频方块排到低位索引，让位打包数据出现更多 0 位，提升网络压缩率。
  # 由反矿透的区块编码链路消费（与遮挡判定共用同一次编码）；只作用于「本次确实被改写」的
  # section——未被改写的 section 会原样搬运原始字节，因此不产生额外开销。
  # 关闭后不做任何重排，字节与不启用本插件时一致。
  # 本项是本模块的「行为开关」：总开关 enabled=true 时才生效。
  #
  # 【默认关闭，依据为 CI 实测结论，非猜测】分别用两种压缩口径做对照：
  #   · zlib level 6（网络封包口径）：开启重排使压缩字节普遍变大——全实心 +2.9%、
  #     稀疏矿脉 +4.9%~+6.4%、合成「乱序调色板」形态 +1.4%~+2.3%；
  #   · ZSTD level 3（磁盘缓存口径，同真实调用 Zstd.compress(data, 3)）：同样普遍变大——
  #     全实心 +7.6%~+8.3%、稀疏矿脉 +1.6%~+11.0%、乱序调色板 +6.4%~+8.4%；
  #   两种口径下仅「洞穴」与「主世界地下」略优（约 -0.3%~-3.6%）。
  #   且耗时明显增加（稀疏矿脉 100 档：约 0.022 → 0.111 ms，约 5 倍）。
  #   → 除少数形态外，重排既费 CPU 又使压缩后体积变大，故默认关闭。
  #   保留本开关供后续实验（例如将来只对洞穴/主世界地下形态启用）。
  reorder: false

  # true 时对调色板重排结果做「解码往返自检」，不一致即整块区块放弃改写（fail-open 放行原包）。
  # 会额外分配两份 4096 长数组，仅在排查问题时开启。
  # 注意：本项只在 reorder=true 时才有意义——重排关闭时不会发生任何重排，
  #      自检既不执行也不产生任何分配，开启它等同无效（故无需因关闭重排而改动本项）。
  strict-verify: false

  # 调色板位宽预算封顶（P0-1 新增，默认开启）：修「替换导致的包体膨胀」，兼拿降位宽收益。
  #
  # 背景：section 的每方块位宽由调色板条目数决定（4 位=16 条、5 位=32 条…）。替换会往调色板里
  # 加伪装方块：默认配置的伪装清单含 netherrack，一个接近写满的 4 位主世界 section（16 条/16 条）
  # 被替换成下界岩就会升到 5 位，位打包数据多 25%，且被替换掉的矿条目失效后仍留在调色板里不裁剪。
  #
  # 开启后做两件事（都在工作线程、只作用于被改写的 section）：
  #   1. 改写前算预算：把「所有伪装候选合计将引入的新状态数」与当前位宽剩余空位对账，
  #      超预算时优先选用已在调色板内的伪装方块（去掉调色板外的候选），避免升位；
  #   2. 改写后裁剪：把调色板里引用计数为 0 的失效条目（被替换掉的矿）移除并压缩索引，
  #      条目数降到更低位宽阈值内时一并降位宽（如 5 位 17 条 → 裁到 15 条 → 4 位）——位宽单调不增。
  #
  # 逃生口（红线：宁可包体大，不可漏伪装）：调色板内完全没有可用候选时仍允许 grow 升位；
  # 任何裁剪失败只放弃本节的体积优化，绝不回滚已完成的伪装替换。
  # 关闭（false）时走原路径：替换照常、按需 grow、不裁剪（与旧版本逐字节一致的行为）。
  width-budget: true

entity-culling:
  # 模块总开关。false 时本模块完全不注册（零开销）。
  enabled: true

  # 依据视线射线剔除被完全遮挡的实体（玩家自身、其它玩家与烟花始终放行）。
  # 本项是本模块的「行为开关」：总开关 enabled=true 时才生效。
  raycast: true

  # 强制可见距离：该距离以内的实体不做剔除。
  force-visible-distance: 32.0

  # 【已废弃】工作线程数（原用于把射线路径预计算交给 worker）。
  # 现已改用 Paper 原生 rayTraceBlocks，判定直接在实体所属线程完成，不再有 worker 往返，
  # 因此本键不再生效（仅为兼容旧配置保留，设置后无任何影响）。
  threads: 0

  # 遮挡周期复检的周期（tick）：每个周期都会执行一次复检。
  # 本项决定复检频率：已隐藏实体每周期全量复检；其余追踪实体按下面的 recheck-budget 轮转分片复检。
  # 越小越实时、开销越高；建议 5~20。
  update-interval-ticks: 10

  # 周期复检预算：每个周期（上面 update-interval-ticks）额外按「轮转分片」复检的
  # 「可见追踪实体」条数上限。
  #
  # 为什么必须要有它：实体在「进入追踪范围那一刻」只评估一次（PlayerTrackEntityEvent）。若实体是先可见、
  # 之后才被墙/地形挡住，那么只复检「已隐藏」集合就永远发现不了它——剔除收益会退化为只覆盖「入场即被遮挡」的实体。
  # 本项让复检轮转覆盖全部追踪实体：如 50 个实体、预算 10 → 5 个周期内全部复检一次，
  # 因此新出现的遮挡也会被隐藏。
  #
  # CPU 取舍：本项把「每周期原生射线判定」的次数摊平为固定上限。取值越大，发现新遮挡越快，
  # 但每周期实体所属线程的原生射线次数同比上升；取值越小越省 CPU，但收敛（隐藏/恢复）更慢。
  # 建议 8~16；默认 12（约「每 0.5 秒多复检 12 个追踪实体」）。
  # 注意：已隐藏实体不受本预算限制，仍每周期全量复检（尽快恢复可见，这是既有行为）。
  recheck-budget: 12

  # 每实体最多尝试的候选顶点数（注意：改用 Paper 原生射线后，本键不再表示「每条射线的采样数」）。
  # 判定把包围盒「朝向玩家一侧」的可见顶点逐一射向眼睛，任一条通畅即判「未被完全遮挡」；
  # 顶点最多 7 个，因此取值 ≥7 等价于「全部顶点都试」：
  #   越大越不容易误藏（多点里总有一条通畅），但每实体的原生射线次数同比上升；
  #   越小越省 CPU（提前返回），但可能因唯一顶点恰好压在相邻方块那一侧而误藏可见实体。
  # 钳制范围 1~8；默认 8（= 全部可见顶点都试，宁可少隐藏也不误藏）。
  ray-samples: 8

afk:
  # 模块总开关。false 时本模块完全不注册（不建监听、不注册低价值包过滤，零开销）。
  enabled: true

  # 玩家无操作（未跨越方块边界移动）超过该秒数即视为 AFK。
  seconds: 300

  # AFK 玩家的低价值包丢弃距离（格）：超过该距离的粒子、方块破坏动画等直接不发送。
  distance: 16.0

  # 是否丢弃远处「世界粒子」包（数量大、价值低）。
  drop-particles: true

  # 是否丢弃远处「方块破坏动画」包。
  drop-block-break-animation: true

latency:
  # 模块总开关。false 时本模块完全不注册（不建监听、不起周期检查任务，零开销）。
  enabled: true

  # 玩家延迟超过该阈值（毫秒）时开始观察。
  threshold-millis: 400

  # 超阈值需持续该秒数才真正降视距，避免瞬时抖动误触发。
  sustain-seconds: 30

  # 触发后降低的视距（区块数）。
  reduce-view-distance: 2

  # 视距下限：无论如何不会降到该值以下，避免完全看不到周围。
  min-view-distance: 4

  # 延迟采样周期（秒）。
  check-interval-seconds: 5

diagnostics:
  # 周期运行摘要的输出间隔（秒）：每过该时间向控制台输出一行 INFO 精简摘要
  # （反矿透改写/显形/实体隐藏/磁盘缓存/工作队列的关键计数）；0 表示不输出。
  interval-seconds: 60