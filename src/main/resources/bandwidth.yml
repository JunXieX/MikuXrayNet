# ===========================================================================
#  MikuXrayNet —— 带宽优化配置
# ---------------------------------------------------------------------------
#  作用：在「不改变玩家看到的内容」的前提下少发封包、少占带宽。
#        每个子模块都有自己的总开关 enabled：关闭后该子模块完全不运行（零开销）。
#        所有子模块均为「失败即放行」：任何异常都不会丢包、不会卡住玩家。
#
#  本文件不会被插件回写；修改后执行 /mikuxraynet reload 生效。
#  例外：palette 段的 width-budget / strict-verify 在启动期固化为编码链路设置，
#        reload 不会重建编码器，改动这两项需重启服务端才生效（see palette 段注释）。
#
#  【本版默认值：性能优先，并保障玩家体验】
#  带宽模块全部默认开启，各参数取「更能省带宽」的档位；玩家体验由各模块自带的兜底机制保证，例如：
#  block-changes 的交互半径内原包立即放行、entity-culling 只剔除真实被遮挡的实体且近身强制可见、
#  afk 只判定真正长时间无操作的玩家、latency 降视距有持续时间门槛与视距下限。
#  若你想让优化在观感上完全不可见（更少省带宽），可在下面各键的注释里找到「更保守的可选值」自行调回
#  （这些项都支持 /mikuxraynet reload 热生效）。
# ===========================================================================

# 带宽优化总开关。关闭时以下所有子模块都不生效。
enabled: true

entity-packets:
  # 模块总开关。false = 本模块完全关闭（零开销）。
  enabled: true

  # 取消「零位移」实体位置包（纯位移包 REL_ENTITY_MOVE 的 dx/dy/dz 全为 0），可降低实体密集区的带宽。
  # 说明：朝向包（REL_ENTITY_MOVE_LOOK / ENTITY_LOOK）不做此取消——其 yaw/pitch 是「绝对量化角」
  # （0 表示朝正南 / 平视），不是相对增量；按全 0 取消会让客户端保留旧朝向、产生持久朝向错误。
  skip-zero-movement: true

  # 白名单：这些实体类型即使零位移也照常下发（如盔甲架、展示框）。
  # Folia 服务端下无法安全枚举实体，该白名单暂时不生效（退化为对所有实体生效，不影响正确性）。
  whitelist:
    - armor_stand
    - item_frame
    - glow_item_frame

block-changes:
  # 模块总开关。false = 本模块完全关闭（零开销）。
  enabled: true

  # 合并同一玩家短时间内周围的方块变更，减少封包数量。
  merge: true

  # 合并半径（曼哈顿距离）：合并更多远处变更、更省包；交互半径内不受影响（见下面的 immediate-radius）。
  # 默认 4（性能优先）；上限 16（范围越大越省包且不影响正确性）。
  merge-radius: 4

  # 单个合并包允许包含的最大方块变更数；上限 32768（单包容量越大越省包）。
  max-per-packet: 4096

  # 超出上限时，剩余变更是否拆分为后续包继续发送（false = 本次放弃合并、原包照常放行）。
  resend-on-overflow: true

  # 合并时间窗（毫秒）：窗口内到达的变更会延迟到窗口到期合并发送。
  # 默认 40（性能优先）：更长时间窗合并更多变更、更省包；玩家挖/放方块的实时手感由
  # immediate-radius（默认 8 格内原包立即放行）兜底，窗口略长也不会出现「顿感」。
  # 越省带宽可调大、越实时可调小；更保守的可选值 20；上限 200（窗口即玩家可感知的更新延迟上界）。
  merge-window-millis: 40

  # 每名玩家的待发缓冲条目上限；达到上限立即冲刷，避免缓冲无界增长。
  # 上限 8192（缓冲越大越省包，内存可控）。
  max-pending-entries: 256

  # 立即放行半径（格，0 = 关闭，即全部走合并）：玩家周围该半径内的方块变更不合并、原包立即放行，
  # 因此不影响挖掘/放置的实时手感；半径外的变更（爆炸、大面积刷新等）照常合并。
  # 默认 8（体验兜底，保持不降）；取值越大越顺滑、但省包收益越低；上限 64。
  immediate-radius: 8

palette:
  # 模块总开关。false = 本模块完全关闭（零开销）。
  # ⚠ 本节（enabled / width-budget / strict-verify）在启动期固化为编码链路设置，
  #   修改后需重启服务端才生效；/mikuxraynet reload 不会重建编码器。
  enabled: true

  # 调色板收缩/降级后做一次一致性的自检，不一致即放弃本区块的改写、按原包放行。
  # 仅在 width-budget=true 时有意义、且会略微增加开销，排查问题时才建议开启。
  strict-verify: false

  # 调色板位宽预算（默认开启）：避免「替换方块导致封包变大」，并顺带压缩可有可无的调色板条目。
  # 打开后优先使用区块里已有的方块作为伪装、并清理不再使用的旧条目，多数情况下区块封包会变小。
  # 同时含改写后的调色板收缩与**单值/低位宽降级**：整节只剩一种方块时改用单值调色板（约 10 字节，
  # 而非 4 位间接的约 2KB），直接调色板（15 位）在状态数降到 256 以内时降回间接并取最小位宽。
  # 关闭后走原路径：替换照常，但按需扩大调色板、不做清理与降级（包体可能变大）。
  # 注意：本项任何步骤失败都只会放弃体积优化，绝不会漏伪装。
  width-budget: true

  # 【历史说明，请勿恢复】本段曾提供 reorder（按频次重排调色板，把高频方块排到低索引）。
  # 实测多数形态反而使压缩字节变大——zlib level 6（网络封包口径）下合成形态 +2.3% ~ +11.0%、
  # ZSTD level 3（磁盘缓存口径）下同样普遍变大，仅洞穴/主世界地下形态略优（约 -0.3% ~ -3.6%），
  # 而耗时增至约 4~6 倍。故已彻底移除该开关，不再保留「会变差的开关」。
  # 若要重新引入类似的重排，请先在同一批负载上取得两种压缩口径都为正收益的可复现证据。

entity-culling:
  # 模块总开关。false = 本模块完全关闭（零开销）。
  enabled: true

  # 依据视线剔除被完全遮挡的实体（玩家自身、其它玩家与烟花始终放行）。
  # 关闭时本模块整体不注册（含下面的 frustum 视锥剔除子项）。
  raycast: true

  # 强制可见距离：该距离以内的实体不做剔除。
  # 默认 32（性能优先，设计兜底值）：剔除更多远处实体以省包；近身/视野中心的实体仍在范围内放行。
  # 想更保守可调大（如 64，基本察觉不到剔除存在）；上限 1024（越大越多实体不被剔除、越安全）。
  # 下限 16：本项是「近身实体一律可见」这层兜底的全部承载，配 0/负数会静默关掉它（身边薄墙后的
  # 实体也会被隐藏），因此低于 16 会被抬到 16 并在控制台提示一次。
  force-visible-distance: 32.0

  # 遮挡复检周期（tick）：越小越实时、开销越高。
  # 默认 10（性能优先）：复检更省 CPU；遮挡/可见切换的延迟由「已隐藏实体每周期全量复检」兜底，
  # 玩家几乎察觉不到。想更实时可调小；上限 40（再长会让「误藏」持续过久，可被玩家感知）。
  update-interval-ticks: 10

  # 每个复检周期额外抽查的「可见实体」条数上限（轮转进行）。
  # 实体先可见、之后才被墙挡住的情况就靠它发现：如 50 个实体、预算 10 则 5 个周期内全部复检一次。
  # 默认 12（性能优先）：兼顾收敛速度与每周期主线程射线次数；建议区间 8~24。
  # 上限 2048（越大收敛越快、越安全，但每周期射线次数同比上升）。
  # 已隐藏的实体不受本上限约束，仍每周期全量复检（尽快恢复可见）。
  # ⚠ 当 async-occlusion 开启且真正接线时，本项【不再生效】：异步路径每周期提交全部追踪实体，
  #   射线成本改由 occlusion-time-budget-ms 封顶（见文件末尾「异步遮挡判定」一节）。
  recheck-budget: 12

  # 每个实体最多尝试的检测点数（1~7，默认 7 = 全部可见顶点都试）：
  # 越大越不容易误藏可见实体、CPU 略高；越小越省 CPU，但可能误藏本可见的实体。
  ray-samples: 7

  # 视锥剔除：在「被墙完全挡住」之外，再剔除「位于视野锥外、且在距离门之外」的实体
  # （玩家背后 / 侧后根本看不到的实体），连射线都省下。
  # 视线方向与邻近显形共用同一套视锥数学，两处行为一致。
  frustum:
    # 子开关。false = 不做任何视锥判定（仍保留上面的射线剔除）。
    enabled: true

    # 视锥竖直张开全角（度）。默认 110 = 客户端可设置的最大 FOV，取它可保证
    # 「玩家把 FOV 拉满也看不到被剔除的实体」（安全优先的默认值）。
    # 30~175；调小更省带宽，但玩家 FOV 开得较大时可能看到实体「迟一步出现」。
    fov: 110.0

    # 距离门（格）：不超过该距离的实体永不做视锥剔除。
    # 为什么需要它：实体在锥外只说明「此刻看不到」，玩家一转头就会重新看到；距离门把剔除限制在
    # 「锥外 + 超距」的实体上，避免近处实体在转头瞬间「消失再出现」。
    # 有效距离门 = max(本值, 上面的 force-visible-distance)——强制可见距离内一律不剔除是硬安全策略，
    # 因此本值配得比强制可见距离小不会产生额外效果。默认 24（故默认实际从 32 格起生效）。
    # 调大更保守（如 48/64，几乎察觉不到剔除）；上限 1024（越大越多实体不被剔除、越安全）。
    min-distance: 24.0

  # ---------------------------------------------------------------------------
  # 异步遮挡判定：把「实体遮挡判定」从实体线程上的原生射线，改为「自持区块遮挡位图 + 专用异步线程池
  # 步进射线」，从而取消条数封顶（收敛延迟不再随在线实体数线性增长）、并把射线 CPU 移出主/区域线程。
  #
  # ⚠ 本组功能【默认开启】。生效前提：raycast=true，且反矿透（antixray.enabled）正在运行——
  #   遮挡位图由反矿透解码时旁路生成，反矿透未启用时本子项不会接线（控制台会打一次中文 WARN，
  #   实体剔除自动回退同步原生射线）。
  # ⚠ 热重载范围：本节的调优键（时间预算 / 线程数 / 最大遮挡数 / 超时周期 / 防抖）随带宽管线重建
  #   即时生效；但【总开关 async-occlusion 本身】需要重启服务端（遮挡位图仓库在反矿透启动时一次性创建）。
  # 关闭时完全保持原有同步射线行为（recheck-budget 等既有键照常生效）。
  # 安全语义不退化：近身强制可见、任何异常/超时/位图缺失一律按「可见」处理（fail-open）、
  #   迟到结果超时丢弃、跨世界结果作废、防抖——均与现状一致或更强。
  # ---------------------------------------------------------------------------

  # 异步遮挡总开关。false = 不建遮挡位图、不起专用池，回退同步原生射线（零额外开销）。
  # 默认【开启】：位图与射线口径已与同步射线对齐（同一套 Material#isOccluding()），
  #   且已完成真机验证（启用/停用/热重载无线程泄漏；口径对照 1196 种方块零差异）。
  # 想退回同步原生射线（例如排查问题时）改成 false 即可，行为与开启前完全一致。
  async-occlusion: true

  # 每周期每玩家的射线时间预算（毫秒）。异步不减少总 CPU、只搬走它，因此必须用「时间预算」
  # （而不是条数封顶）为成本设上界；超预算的实体顺延到下一周期，不会丢判定。
  # 默认 2.0；区间 0.1 ~ 50（超范围会被钳制到边界并在控制台提示一次）。
  occlusion-time-budget-ms: 2.0

  # 异步遮挡专用线程池的线程数。刻意与反矿透改写池隔离（改写有 50ms 级预算），避免互相饿死。
  # 射线是纯 CPU、无阻塞，1 个线程即可线性扩展。默认 1；区间 1 ~ 4。
  occlusion-threads: 1

  # 步进射线允许穿过的最大遮挡方块数。0 = 路径上不能有任何遮挡方块（最严格，推荐）；
  # 越大越容易把「其实看得见」的实体判成被挡住（多藏）。默认 0；上限 3。
  max-occluding-blocks: 0

  # 结果超时丢弃周期数：提交后超过该周期数仍未回投的判定会被丢弃，并按「保持可见」处理，
  # 避免用陈旧几何去隐藏实体。默认 3；区间 1 ~ 10。
  occlusion-timeout-cycles: 3

  # 防抖：同一实体的判定需连续该周期数一致才允许切换显示状态，避免在「刚好被挡/刚好可见」
  # 的边界反复隐藏/显示造成闪烁。0 = 不防抖；默认 1；上限 5。
  occlusion-hysteresis-cycles: 1

afk:
  # 模块总开关。false = 本模块完全关闭（零开销）。
  enabled: true

  # 玩家无操作（未跨越方块边界移动）超过该秒数即视为 AFK。默认 300 秒；上限 86400（1 天，再大几乎不可能触发）。
  seconds: 300

  # AFK 玩家的低价值包丢弃距离（格）：超过该距离的粒子、方块破坏动画等直接不发送。
  # 上限 1024（越大越少误丢玩家看得见的远处包，越安全）。
  distance: 16.0

  # 是否丢弃远处「世界粒子」包（数量大、价值低）。
  # 默认 true：粒子数量最多、视觉价值最低，且仅对长时间无操作的 AFK 玩家生效。
  drop-particles: true

  # 是否丢弃远处「方块破坏动画」包。
  # 默认 true（性能优先）：破坏动画包数量可观，丢弃可省带宽；玩家体验由「AFK 判定只看真实操作」兜底
  # ——只要玩家还在交互/移动/聊天就不会被判为 AFK，因此真在操作的人看不到动作中断。
  drop-block-break-animation: true

latency:
  # 模块总开关。false = 本模块完全关闭（零开销）。
  enabled: true

  # 玩家延迟超过该阈值（毫秒）时开始观察。
  # 默认 400（性能优先）：更早发现卡顿并介入；仅有明显持续卡顿才会触发（见下面的 sustain-seconds）。
  # 想更保守可调大（如 1000）；上限 60000（再高早已断线，永不触发）。
  threshold-millis: 400

  # 超阈值需持续该秒数才真正降视距，避免瞬时抖动误触发。
  # 默认 30（性能优先）：仍需持续 30 秒才动作，足以排除偶发抖动；想更保守可调大（如 60）。
  # 上限 3600（再长等于永不触发）。
  sustain-seconds: 30

  # 触发后降低的视距（区块数）。
  # 默认 2（性能优先）：降幅略大更省带宽；由「视距下限」与持续时间门槛兜底体验。
  # 想更保守可调小（如 1）；上限 4（一次降太多会让弱网玩家几乎看不见）。
  reduce-view-distance: 2

  # 视距下限：无论如何不会降到该值以下，避免完全看不到周围。
  # 默认 6（体验兜底）：这是「视距最多降到多少」，太低等于体验崩塌，故设安全下限 6，
  # 低于 6 会被抬升到 6 并在控制台提示一次；上限 16（不应超过常见最大视距）。
  min-view-distance: 6

  # 延迟采样周期（秒）；上限 3600（再长等于停止巡检）。
  check-interval-seconds: 5

diagnostics:
  # 周期运行摘要的输出间隔（秒）：每过该时间向控制台输出一行 INFO 精简摘要；
  # 0 表示不输出；上限 86400（1 天，再长等于不再输出）。
  interval-seconds: 60