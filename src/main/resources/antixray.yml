# ===========================================================================
#  MikuXrayNet —— 反矿透配置
# ---------------------------------------------------------------------------
#  原理：出站区块封包改写。把目标方块（矿透目标）随机替换为常见的伪装方块，
#        再由「邻近显形」在玩家靠近且可见时把真实方块发回客户端。
#        伪装范围由 obfuscation.mode 决定：
#          all      —— 所有目标矿一律伪装（默认；透视看不到任何真实矿物，含矿洞壁上的裸露矿）；
#          enclosed —— 只伪装 6 个正交方向全被遮挡的「掩埋矿」，裸露矿保持原样（旧行为）。
#
#  注意：本文件带完整中文注释，插件不会回写本文件；
#        修改后执行 /mikuxraynet reload 生效。
# ===========================================================================

# 反矿透总开关。false 时整个模块不加载，不注册任何封包拦截。
enabled: true

# 生效世界名列表（Bukkit 世界名，如 world / world_nether）。
# 留空（[]）表示对所有世界生效。
worlds: []

# ---------------------------------------------------------------------------
# 逐世界覆盖（world-overrides，P0-2 新增）：
#   为单个世界（或一批世界）覆盖 obfuscation 的任意子键，未覆盖的键回落上方全局默认。
#   · 键名是世界名「模式」：精确名（world_nether）或通配（world_*，* 匹配任意字符）；
#   · 匹配优先级：精确名 > 通配；多个通配同时命中时取「模式最长」的（最具体）；
#   · 每个世界段下都挂一层 obfuscation:，可覆盖的子键与全局 obfuscation 相同：
#       hide-blocks / replacement-weights / replacement-bands / min-y / max-y / mode；
#   · 只写需要覆盖的键即可（例如下界只换伪装方块清单，其余全部沿用全局）；
#   · 本段影响改写结果并参与缓存指纹（不同世界各自生效，缓存互不串包）；
#     修改后执行 /mikuxraynet reload 生效。
# 下方为完整示例（默认全部注释，不覆盖任何世界）：
# world-overrides:
#   world_nether:                       # 下界：换目标与伪装清单 + 限定高度
#     obfuscation:
#       hide-blocks: [nether_gold_ore, nether_quartz_ore, ancient_debris]
#       replacement-weights: {netherrack: 10, basalt: 4, blackstone: 2}
#       min-y: 0                        # 该世界的高度范围（可选，缺省不限制；判定与替换都跳过范围外方块）
#       max-y: 120
#   world_the_end:                      # 末地：只覆盖隐藏清单，其余回落全局
#     obfuscation:
#       hide-blocks: [end_stone_bricks, purpur_block]
#   resource_*:                         # 通配：所有 resource_ 前缀的世界用 enclosed 模式
#     obfuscation:
#       mode: enclosed


obfuscation:
  # 需要隐藏（伪装）的方块名称列表。
  # 名称使用 Minecraft 注册名（小写、无需 minecraft: 前缀），对应方块及其
  # 全部状态都会被识别为目标。也支持 tag(...) 语法（见下方说明）。
  # 共 38 种：
  # 【21 种原有】19 种矿石（含深层变体）之外，另含两种与矿等价的透视目标——
  #   spawner          刷怪笼：透视端常用来定位地牢/要塞（真机 PE 26.2 映射里注册名就是 spawner，
  #                    旧的 mob_spawner 已不存在，填错名字会在启动日志里提示「无法识别」）。
  #   mossy_cobblestone 苔石：天然只出现在地牢/要塞/矿洞结构里，是透视定位结构的标志物。
  # 【17 种扩展】对齐 Paper 默认 hidden-blocks 与 Orebfuscator 的目标面：
  #   · 容器/功能方块：透视端可凭箱子/熔炉等的轮廓与方块实体数据定位地下基地与矿洞入口；
  #     这些方块多带方块实体，被伪装 section 内其方块实体本就会被 remove-block-entities 剔除，
  #     与伪装逻辑不冲突（名称已用真机 PE 26.2 状态表逐一核实）。
  #   · 结构暴露型：基岩层与黏土斑块可反推坐标与地形，粗金属块直接对应富矿脉，
  #     黑曜石是折跃门/灌溉结构的标志物。
  hide-blocks:
    - coal_ore
    - deepslate_coal_ore
    - iron_ore
    - deepslate_iron_ore
    - copper_ore
    - deepslate_copper_ore
    - gold_ore
    - deepslate_gold_ore
    - redstone_ore
    - deepslate_redstone_ore
    - lapis_ore
    - deepslate_lapis_ore
    - diamond_ore
    - deepslate_diamond_ore
    - emerald_ore
    - deepslate_emerald_ore
    - nether_gold_ore
    - nether_quartz_ore
    - ancient_debris
    - spawner
    - mossy_cobblestone
    # —— 容器/功能方块（多为方块实体，remove-block-entities 会一并剔除其数据）——
    - chest
    - trapped_chest
    - ender_chest
    - barrel
    - furnace
    - blast_furnace
    - smoker
    - hopper
    - dropper
    - dispenser
    - shulker_box
    # —— 结构暴露型方块 ——
    - bedrock
    - raw_iron_block
    - raw_gold_block
    - raw_copper_block
    - obsidian
    - clay
  #
  # tag(...) 语法（可选）：条目写成 tag(名称) 时会在启动期展开为该 tag 下的全部方块，
  # 例如 tag(diamond_ores) = diamond_ore + deepslate_diamond_ore。
  # 离线无法查 Bukkit 的 tag 注册表，因此内置了一张「常用 tag 静态映射表」（_ores 系列、
  # base_stone_overworld / base_stone_nether / base_stone_end 等）；映射表之外的 tag 名
  # 会在启动日志 WARN 提示并忽略该条目（不猜测成员、绝不误藏）。普通名称与 tag(...) 可混用。
  #
  # 示例（默认不启用，需要时自行改写上面的清单）：
  #   - tag(diamond_ores)      # = diamond_ore + deepslate_diamond_ore
  #   - tag(base_stone_nether) # = netherrack + basalt + blackstone

  # 伪装范围模式：enclosed | all（非法值一律按 all 处理）。
  #   all（默认）——所有目标矿一律伪装，不看 6 面遮挡。透视端看不到任何真实矿物（含矿洞壁上
  #                 裸露的矿）。副作用：矿洞壁上的矿在一段时间内会显示为伪装方块，玩家靠近
  #                 且视线无遮挡时才被「邻近显形」还原；若显形不及时，可能出现「看着是石头、
  #                 挖开其实是矿」的情况——这是该模式的固有代价（换来的是裸露矿不再被透视）。
  #                 CPU 略降（省去逐方块的 6 面遮挡判定）。
  #   enclosed   ——只伪装 6 个正交方向全被遮挡的「掩埋矿」，矿洞壁/地表等裸露矿保持原样。
  #                 观感最自然（玩家几乎不会看到假方块），但透视能直接看到裸露在矿洞里的矿。
  # 说明：本项影响改写结果并参与缓存指纹，切换后会整体重建缓存（含磁盘缓存）。
  mode: all

  # 伪装方块与随机权重（权重越大概率越高，必须为正整数）。
  # 建议只填地下常见方块，避免出现违和感。
  # 这是「回落表」：当 replacement-bands 未启用、或某高度未被任何分段覆盖时使用。
  replacement-weights:
    stone: 10
    deepslate: 8
    netherrack: 6

  # 按 Y 分区的加权伪装表（P0-3 新增，默认不启用）：
  # 每个分段声明一个高度区间（min-y/max-y，含端点）与该区间内的伪装权重表；
  # 改写时按方块绝对 Y 找「第一个覆盖它的分段」取伪装候选，未落在任何分段内的高度
  # 回落上方 replacement-weights。分段优先于 replacement-weights（配了即生效）。
  # 用途：深层用深板岩系、浅层用石头系，伪装观感与真实地层一致，抗统计识别更强。
  # 性能：每段的累计权重表都在启动期预构建为 int 数组，热路径只有一次小数组线性扫描，
  #       无逐方块 HashMap / 装箱；段内候选还会与「调色板位宽预算」联动（见 bandwidth.yml
  #       的 palette.width-budget）——调色板写满时优先选用已在调色板内的候选避免升位。
  # 示例（默认注释，需要时取消注释）：
  # replacement-bands:
  #   - min-y: -64
  #     max-y: -1
  #     weights: {deepslate: 10, tuff: 4, stone: 2}
  #   - min-y: 0
  #     max-y: 320
  #     weights: {stone: 10, andesite: 3, dirt: 2}

  # 高度范围（P0-2 新增，可选；min-y/max-y 缺省即不限制）：
  # 只伪装该绝对高度范围内的目标方块，范围外的方块判定与替换都跳过（如地表 y>=60 不伪装）。
  # 逐世界可用 world-overrides 覆盖（见文件顶部说明）。
  # 示例（默认注释）：
  # min-y: -64
  # max-y: 60

  # true：同一高度层统一使用同一种伪装方块（层状伪装，观感更整齐）；
  # false：逐方块独立随机（更不易被模式识别）。
  layer-obfuscation: false

  # true：被替换掉的方块若原本带有方块实体（如刷怪笼——默认隐藏清单里的 spawner 就带实体），
  #       则从区块封包中一并剔除其方块实体数据，防止客户端残留幽灵方块实体（如隐形箱子/刷怪笼）。
  # false：跳过剔除（省一次逐方块实体的比对），封包保留服务端原发的全部方块实体数据。
  remove-block-entities: true

  # use-block-below（默认 false，保持既有行为）：命中伪装时，若该方块「下方紧邻方块」可用
  # （非空气/非流体、且不是目标方块），优先用它当伪装方块（观感更自然：伪装方块与脚下地层一致，
  # 不会出现「石头层里冒出深板岩」这类违和拼接；同竞品 ObfuscationProcessor 的思路）。
  # 下方不可用（空气/流体/真矿）时自动退回 replacement-weights 随机伪装，绝不漏伪装。
  # 注意：本项改变改写结果，参与缓存指纹；切换后（含磁盘缓存）会整体失效重建。
  use-block-below: false

occlusion:
  # 遮挡判定的「人工纠正表」。内置判定用 PacketEvents 的方块语义近似：
  #   空气 / 非固体（isSolid=false）/ 形状超出整方块（exceedsCube）/ 装饰性材质（玻璃、
  #   树叶、液体、植物等）/ 薄片族名称后缀（台阶、楼梯、墙、板、门…）一律不算遮挡；
  #   双层台阶（状态属性 type=double）会被显式判为遮挡。
  # 若你的服务器上发现某个方块被误判（表现为「该藏起来的矿物没藏」或「不该藏的藏了」），
  # 就把它的注册名填到下面两张表里——这是你自行纠正判定的唯一出口。
  # 名称用 Minecraft 注册名（小写、无需 minecraft: 前缀），填写后需重启服务端生效。
  #
  # 注意：本表影响改写结果，因此参与缓存指纹；改动后（含磁盘缓存）会整体失效重建。

  # 额外视为「遮挡」的方块（可覆盖上面的内置规则）。示例：
  #   extra-occluding:
  #     - cobblestone_stairs      # 若你的玩法里楼梯也算遮挡
  #     - honey_block
  extra-occluding: []

  # 额外视为「不遮挡」的方块（优先级最高，压过 extra-occluding 与全部内置规则）。示例：
  #   extra-non-occluding:
  #     - chest                  # 箱子形状不满整方块，避免误判为遮挡
  #     - shulker_box
  extra-non-occluding: []

neighbors:
  # 是否抓取 4 个水平邻区块「贴边那一层」方块，用于消除区块边界泄漏。
  # 关闭后：区块边界那一圈方块按 missing-policy 处理，不会再读取任何邻块数据
  #（最省 CPU，但区块边界判定精度下降）。
  # 开启后：首次遇到某个区块时会在主线程/区域线程抓取快照（约 1~6ms 一次），
  #          之后同区块复用缓存；世界卸载时整体失效。
  enabled: true

  # 邻块数据取不到时（未加载、Folia 跨区域、世界卸载等）的策略：
  #   hide   —— 视为遮挡，宁可多伪装也不留下沿 16×16 网格线的透视口子（默认，推荐）；
  #             代价是极少数「其实暴露」的边界方块也会被伪装成石头。
  #   expose —— 视为暴露，保持「区块边界不伪装」的旧行为；性能更好但存在可利用的透视漏洞。
  missing-policy: hide

  # 邻块贴边快照的缓存条目上限（每条 ≈ 4 × 16 × 世界高度字节，主世界 384 高度约 24 KB）。
  # 512 条约 12 MB；多玩家或大视距建议调高（如 2048），调大只增加内存、不会影响正确性。
  # 缓存未命中时会在主线程/区域线程重新抓取一次，因此过小会导致重复抓取、反而更耗 CPU。
  cache-maximum-size: 512

proximity:
  # 邻近显形：玩家靠近「曾被伪装的坐标」时，主动把该坐标的真实方块状态发回客户端。
  # 不开时：客户端会一直看到伪装方块，直到服务端因其它原因下发方块变更（挖到跟前才发现不对）。
  # 开启后由周期任务做「局部扫描」：只遍历玩家身边 ceil(distance/16) 个区块半径内的区块
  # （distance=64 → 半径 4 → 9×9=81 个区块），把其中「曾被伪装、且该玩家还没显形过」的坐标发回客户端。
  # 坐标只会显形一次；整块都已显形的区块直接跳过（整块跳过兜底），
  # 稳态下每周期只处理「新进入视野的区块」。
  enabled: true

  # 触发显形的距离（格，三维欧氏距离，等于阈值也算命中）。建议 6~64：
  # 太小会出现「走到跟前方块才突然变回原样」，太大等于提前把矿物亮给玩家。
  # 默认 64（48 → 64，更早为 32/12）：真机反馈「48 格仍偏近、走到跟前才取消伪装」。
  # 由于显形只在射线通畅（视线真能看到、且只在暴露面上取采样点）时才还原，放大距离不会隔着墙泄露
  # ——它只是把「本来就看得到的矿」更早、更远地还给玩家。扫描半径随之从 3 变为 ceil(64/16)=4
  # （9×9=81 个区块），整块已显形的区块会被整体跳过，扫描量只与「身边还有伪装坐标的区块数」相关。
  # 取舍：越大越及时、观感越接近原版，但候选越多、发包量与每 tick 上限越相关；本项不影响隐藏强度。
  distance: 64.0

  # 巡检周期（tick）。数值越大越省 CPU，但显形越迟（4 tick = 0.2 秒）。
  # 默认 4（原为 5）：显形更及时，缩小「转身后石头还没变回来」的窗口；局部扫描已把单周期
  # 开销与探索历史脱钩，缩短周期的额外扫描量可忽略。
  interval-ticks: 4

  # 每次巡检最多发送的显形包数量（防止一次性刷包）：
  # 普通服务端为「全服合计」，Folia 为「每个玩家各自的巡检上限」。
  # 默认 256（原为 128）：配合扩大到 64 格的距离，候选数量上升，额度也要相应放大，
  # 否则脚边的矿会被远处候选挤到后面。4 tick 一次 256 个 ≈ 1280 个/秒上限，仍远低于区块包流量。
  # 未轮到发送的坐标会保留到下次巡检，不会丢失；候选按距离由近到远排序，因此总是先还原脚边的矿。
  max-reveals-per-tick: 256

  # 显形结构的过期秒数（兜底）：区块卸载事件没触发时，超过该时间且近期未被扫描到的条目会被清理。
  # 默认 300（原为 120）：登录/传送后区块是「一次性连续下发」的，玩家往往要过一会儿才走到近处；
  # 窗口太短会让「还没走到就被清掉」的坐标永不还原。玩家身边的条目会随扫描持续刷新，不会被误清。
  expire-seconds: 300

  # 安全阀（原为「显形索引容量上限」）：正常运营下这两个计数应恒为 0，触发即说明索引管理有 bug。
  # 结构重构后不再需要「按玩家容量淘汰」：
  #   · 伪装坐标按区块共享（ObfuscatedChunkIndex）——内存 = O(有伪装的已加载区块数)，与玩家数无关；
  #   · 已显形坐标按玩家记录（RevealedSet）——只记实际发过显形包的坐标，天然有界。
  # max-positions            ：伪装区块索引的坐标总量安全阀（触顶时按「最旧优先」淘汰其它区块）。
  # max-positions-per-player ：单玩家已显形坐标数的安全阀（触顶时放弃本次标记，最坏只多显形一次）。
  # 注意：这两项是「兜底」而非「调优旋钮」——/mxnet status 的显形索引行会显示「安全阀触发 X/Y」，
  #   非 0 时应连同 /mxnet dump 反馈，而不是调大上限。
  max-positions: 4194304
  max-positions-per-player: 524288

  # 视锥剔除：只显形玩家「看得到的方向」上的坐标。
  # 收益：背后/脚下的坐标不再白白发包（省带宽）。
  # 代价：快速转身时，侧后方刚进入视野的坐标要等下一次巡检（默认 4 tick = 0.2 秒）才显形，
  #       观感上可能有一瞬间的「石头还没变回来」。追求极致实时可把它关掉。
  frustum:
    enabled: true

    # 视野锥「竖直方向」全张开角（度）——含义与 Minecraft 客户端的 FOV 设置一致（默认 70，本项默认 80）。
    # 重要：这是**全角**，不是半角。判定按矩形投影（与客户端一致）分解成两轴：
    #   竖直方向：与视线俯仰之差 ≤ fov/2（80° → 40°）；
    #   水平方向：因屏幕宽高比（按 16:9 估算）而更宽，≈ 2×atan(tan(fov/2) × 16/9) ≈ 112°（半角约 56°）。
    # 修正前只按「圆锥半角 40°」判定（对水平方向过窄），真机日志显示 445/512 个候选被剔除（87%，偏高），
    # 大量「明明在屏幕里」的侧前方坐标被误剔；现在按上述两轴判定，与客户端观感一致。
    # 建议 70~110；填 0 或 >360 会被回落为 80。
    fov: 80.0

    # 该距离（格）以内的坐标豁免视锥判定：贴脸/脚下即便在视野边缘也必须显形，
    # 否则会出现「贴着走过的矿石不显形」的怪现象。
    # 取舍：越大越安全（转身时侧后方刚进视野的坐标也能立刻显形）、越小越顺滑（更接近逐格显形）；
    #       本项只豁免「视锥」判定，不影响射线遮挡判定。
    min-distance: 4.0

  # 射线可见性判定（多候选点采样）：从玩家眼睛向目标方块的一组候选点做体素步进，
  # 任一条射线完全通畅即判为「可见」并显形；全部被挡才不显形（等玩家靠近再说）。
  # 候选点（最多 5 个，命中即返回）：① 正对玩家的那个暴露面的中心 → ② 包围盒最近点（仅当它落在暴露面上）
  #   → ③ 该暴露面的四角中离眼睛最近的至多 3 个。
  # 关键约束：只对「暴露面」取点——先用方块遮挡表判断该方块哪些面朝向非遮挡方块，不暴露的面一个点都不采。
  # 这样彻底避免了「单点采样碰到棱角/旁边方块 → 必须贴脸才显形」的老问题（真机反馈的角落矿场景）。
  # 起点（眼睛）与终点所在体素都会被排除，避免自遮挡；采样数有限，宁可漏判（多显形）也不误挡。
  # 收益：隔着墙、隔着地层的坐标不会提前亮出来（更接近原版观感，也更难被透视端利用）。
  # 代价：每个候选坐标要读 6 次邻块判暴露面 + 若干次路径采样（都在主线程/区域线程），属纯额外开销。
  # 默认开启（真机 dump 曾显示为 false，导致「隔着墙也把矿亮给透视客户端」）；如确不需要可关掉。
  raycast:
    enabled: true

    # 每条射线最多采样的体素数：越大越准、越费 CPU（每个采样点 = 主线程一次读方块）。
    samples: 16

  # 事件驱动即时显形（周期巡检的「补充」，周期兜底不变）：插件在出站封包里观测到方块变更
  #（挖开/爆炸/活塞等，服务端自己下发的 BLOCK_CHANGE / MULTI_BLOCK_CHANGE）时，若该变更落在
  # 玩家身边（曼哈顿距离 ≤ radius）且变更邻域内仍有伪装坐标，就「当 tick」把邻域内
  # 「已伪装且视线可见」的坐标显形——不再等最多 interval-ticks（0.2 秒）的巡检窗口。
  # 与周期巡检共用同一套显形链路（射线判定 / 已显形标记 / 统计）：同一坐标当 tick 只发一次，
  # 周期巡检也会跳过已显形坐标，两者不会重复发包；变更在半径外等事件路径触不到的场景仍由周期兜底。
  instant-reveal:
    # 总开关（默认开启；关闭后完全回到纯周期巡检行为）。
    enabled: true

    # 曼哈顿半径（格）：变更必须落在玩家身边该半径内才触发（默认 2，与竞品 updateRadius 一致）。
    # 半径越大，越远处的爆炸也能即时修复，但单次邻域评估量按立方增长；钳制范围 1~8。
    radius: 2

    # 每玩家每 tick 事件显形限额（默认 16，防爆刷：TNT 连爆时最多每 tick 补发 16 个真实方块）。
    # 未轮到的坐标保留在伪装清单里，由下一 tick 的限额或周期巡检继续显形，不会丢失。0 = 关闭事件显形。
    max-per-tick: 16

  # 过度显形量化（只计数、不改任何行为）：显形发包前按 1/N 抽样，若「已显形集合」已含该坐标
  #（说明客户端应已可见，该包是浪费的），按「过度」计数。/mxnet status 与 dump 会显示
  # 「过度显形（抽样） X / 抽样 Y」——X/Y 即浪费占比的无偏估计（样本足够大时），
  # 用于评估是否需要收紧显形策略。默认 20（1/20 抽样，开销可忽略）；0 = 关闭统计。
  over-reveal-sampling: 20

disk-cache:
  # 磁盘缓存：把「已改写完成的区块负载」持久化到
  #   plugins/MikuXrayNet/cache/<世界名>/r.<regionX>.<regionZ>.b_linear
  # （32×32 区块一个文件，格式为 BufferedLinearV3 的 bucket 布局，压缩用服务端自带的 zstd）。
  # 负载里带有「被伪装坐标清单」，因此磁盘缓存命中的区块同样会进入显形索引（否则靠近也不还原）。
  # 格式版本 0x04：升级后 0x03 旧文件会被明确拒绝并删除重建（只提示一次），属正常现象。
  # 收益：重启后同一区块（原始字节指纹 + 配置指纹 + 区块代次都一致时）可直接复用，
  #       省掉重复的解码、遮挡判定与重编码 CPU（首次生成的区块收益最明显）。
  # 代价：额外的磁盘写入与占用，以及维护线程的少量 CPU；缓存永远是「可选加速」，
  #       任何磁盘异常都会自动降级为纯内存路径，绝不影响封包链路（fail-open）。
  #
  # 失效规则：键包含 (世界名, chunkX, chunkZ, 配置指纹, 区块代次)。某区块内观测到
  # 方块变更（出站 BLOCK_CHANGE/MULTI_BLOCK_CHANGE）时递增其区块代次，旧代次条目
  # 读取时判定为未命中并被惰性清理；另有条目过期时间兜底。
  enabled: true

  # 近似条目总数上限（每条约等于一个区块的负载字节）。超出后拒绝新写入（只是少缓存一些）。
  # 20000 条约对应 20000 个区块；按平均 10~30 KB/条估算约 200~600 MB 磁盘占用。
  max-entries: 20000

  # 单个区域文件（32×32 = 1024 个区块）的大小上限（MB）。
  # 达到上限后该文件暂不接受新写入，等后台维护压缩回收（丢弃垃圾与过期条目）腾出空间。
  # 计数同时包含「已落盘字节」与「已接受但尚未 append 的待写字节」（bucket 是整块追加的）。
  max-file-size-mb: 16

  # 条目过期秒数：超过该时间未被重写的条目在读取与后台维护时被清理（默认 30 分钟）。
  expire-seconds: 1800

  # 每个打开的区域文件在内存里缓存的 bucket 数（每个 bucket = 64 个区块槽位）。
  # 这是内存占用的关键旋钮：数值越大读命中越快，但持有的字节越多。
  # 默认 8（原为 2）：真机数据下 bucket 缓存把「重复打开/重解码同一 bucket」的次数压掉约 16~20%
  # （命中率提升 16~20 个百分点），而多驻留 6 个 bucket（≈6×64 槽的负载字节）的内存在
  # idle-close-seconds 的闲置关闭与 max-file-size-mb 的单文件上限双重护栏下可控。
  bucket-cache-size: 8

  # 句柄闲置多久后自动落盘并关闭（秒）：释放文件描述符与内存，避免随世界规模增长。
  idle-close-seconds: 300

  # 后台维护周期（秒）：落盘 + 压缩回收 + 关闭闲置句柄。数值越小越及时、开销略高。
  maintenance-interval-seconds: 30

  # 每轮维护最多压缩回收几个区域文件（限制单轮工作量，避免集中 IO）。
  compact-per-pass: 4

  # 磁盘线程待处理任务上限（条）：积压到上限后新的写请求被直接丢弃（保网络路径不被拖住）。
  queue-capacity: 256

  # 区块代次跟踪表的条目上限（有界 LRU）。被挤出的区块退化为「代次 0」，
  # 最多多一次未命中、不会返回脏数据（读写双方还会校验原始字节指纹与配置指纹）。
  generation-tracker-size: 32768

cache:
  # 改写结果缓存的条目上限（每条约等于一个区块的字节数）。
  maximum-size: 4096

  # 缓存条目在最后一次访问后多久过期（秒）。
  expire-after-access-seconds: 60

advanced:
  # 平台判定兜底：auto | paper | folia（默认 auto）。
  # 本插件同时支持 Paper 系（单主线程、常规 Bukkit 调度）与 Folia 系（区域化多线程、区域调度器），
  # auto 时按服务端自己报出的品牌/版本标识判定（Bukkit.getName() / getVersion() / getBukkitVersion()
  # 任一含 "folia" 才判为 Folia 系），并在启动日志里打印判定依据，例如：
  #   运行平台：Leaf 26.2（Paper 系，单主线程）｜判定依据：服务端名称=Leaf（不含 folia 标识 → Paper 系）
  # 为什么不能靠「类是否存在」判断：现代 Paper 及其下游分支（真机 Leaf 26.2）都会自带
  # io.papermc.paper.threadedregions.* 的 Folia 调度器 API 类，用类存在性会把纯 Paper 误判成 Folia，
  # 从而错误地禁用实体枚举、改走区域调度。
  # 若你的服务端是改了品牌的 Folia 衍生端（标识里没有 folia），把它设为 folia 即可强制走 Folia 路径；
  # 反之若某个分支误报 folia，设为 paper。本项全局生效（同时影响反矿透与带宽两个模块），
  # 改后执行 /mikuxraynet reload 生效（会按新值重新判定并重建周期任务）。
  platform: auto

  # 工作线程数；0 表示按 CPU 核数自动推算（上限 4）。
  threads: 0

  # 单个区块包的处理超时（毫秒）。超时立即放行原包，避免客户端卡在加载界面。
  timeout-millis: 2500

  # 工作队列容量（条）。队列满时直接放行原包，不阻塞网络线程。
  queue-capacity: 2048