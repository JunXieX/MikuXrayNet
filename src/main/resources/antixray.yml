# ===========================================================================
#  MikuXrayNet —— 反矿透配置（按维度分段）
# ---------------------------------------------------------------------------
#  作用：把埋在地下（四面被包住）的矿物、箱子、刷怪笼等替换成普通方块发给客户端，
#        玩家走近且真正看得见时才还原为真实方块，让透视端「看不到真矿」。
#
#  配置结构：
#    · dimensions      —— 主世界 / 地狱 / 末地分别配置：隐藏什么、伪装成什么、怎么伪装；
#    · world-blacklist —— 名单内的世界完全不使用反矿透（例如主城、副本）；
#    · world-overrides —— 为单个世界单独覆盖它所属维度的设置；
#    · 生效优先级（高 → 低）：world-blacklist > world-overrides > dimensions > 内置默认。
#
#  本文件不会被插件回写；修改后执行 /mikuxraynet reload 生效。
# ===========================================================================

# 反矿透总开关。false = 整个模块关闭，所有世界都不做伪装。
enabled: true

# ---------------------------------------------------------------------------
# 反矿透世界黑名单（优先级最高，默认空）：名单内的世界完全不做反矿透——
# 不改写区块、不做邻近显形，也不读写磁盘缓存。主城 / 副本之类不需要防透视的地图放这里。
#   · 名字支持精确匹配（spawn）与通配（dungeon_*，* 匹配任意内容）；
#   · 黑名单高于逐世界覆盖：某世界既在黑名单、又在 world-overrides 里启用了反矿透，仍以黑名单为准；
#   · 只影响反矿透；带宽优化（合并方块变更、实体剔除、AFK 降级等）在这些世界照常生效。
# 修改后 /mikuxraynet reload 生效。
# 示例（默认空列表 = 不豁免任何世界）：
# world-blacklist:
#   - spawn                 # 主城
#   - dungeon_1             # 某个副本世界
#   - dungeon_*             # 所有副本世界
world-blacklist: []

# ---------------------------------------------------------------------------
# 按维度分段：每个维度单独配置「隐藏什么、伪装成什么、怎么伪装」。
#   可用子键：
#     enabled             —— 本维度是否启用反矿透
#     mode                —— all（默认，所有目标方块都伪装，靠邻近显形还原）
#                            | enclosed（只伪装六面都被包住的，暴露在洞穴里的保持原样）
#     min-y / max-y       —— 可选：只在该高度范围内伪装（不写 = 不限制）
#     hide-blocks         —— 要隐藏的方块清单（填方块注册名）
#     replacement-weights —— 伪装方块与随机权重（权重越大出现越多，须为正整数）
#     replacement-bands   —— 按高度分层指定伪装表（配了即优先于上面的回落表）
#     use-block-below     —— 是否优先用下方紧邻方块作为伪装方块（默认 false）
#
#   hide-blocks 支持 tag(...) 写法：例如 tag(diamond_ores) 会自动展开为钻石矿 + 深层钻石矿。
#   插件内置常用 tag 映射（各类 _ores、base_stone_overworld / base_stone_nether /
#   base_stone_end 等）；不认识的 tag 会在启动日志提示并忽略该条目（不会误藏其它方块）。
#   普通名称与 tag(...) 可以混用。
# ---------------------------------------------------------------------------
dimensions:

  normal:                    # 主世界
    enabled: true
    mode: all                # all=全部伪装；enclosed=仅伪装被完全包住的
    # min-y: -64             # 可选：只在此高度范围内伪装（不写=不限制）
    # max-y: 320
    # 默认隐藏：16 种主世界矿石（含深层变体）+ 3 种粗金属块 + 箱子 + 刷怪笼 + 苔石。
    # 默认不隐藏：桶/熔炉族/漏斗/发射器/投掷器/潜影盒/末影箱/陷阱箱（可制造、遍布建筑，
    #              藏它们只会到处出现假方块）以及基岩/黑曜石/黏土（自然方块，透视价值低）。
    # 需要时把对应注册名加进下面清单即可。
    hide-blocks:
      - coal_ore
      - deepslate_coal_ore
      - iron_ore
      - deepslate_iron_ore
      - copper_ore
      - deepslate_copper_ore
      - gold_ore
      - deepslate_gold_ore
      - redstone_ore
      - deepslate_redstone_ore
      - lapis_ore
      - deepslate_lapis_ore
      - diamond_ore
      - deepslate_diamond_ore
      - emerald_ore
      - deepslate_emerald_ore
      - raw_iron_block
      - raw_gold_block
      - raw_copper_block
      # —— 容器（箱子：透视端最想找的目标）——
      - chest
      # —— 结构暴露型方块 ——
      - spawner
      - mossy_cobblestone
    # 伪装方块与随机权重（权重越大概率越高，须为正整数）。建议只填地下常见方块，避免违和感。
    # 这是「回落表」：当 replacement-bands 未启用、或某高度未被任何分段覆盖时使用。
    replacement-weights:
      stone: 10
      deepslate: 8
    # 按高度分层的伪装表（仅本维度生效）：每个分段声明高度区间（含端点）与权重表；
    # 未被任何分段覆盖的高度使用上面的 replacement-weights。
    # 用途：深层伪装成深板岩系、浅层伪装成石头系，观感更接近真实地层。
    replacement-bands:
      - min-y: -64
        max-y: -1
        weights: {deepslate: 10, tuff: 4, stone: 2}
      - min-y: 0
        max-y: 320
        weights: {stone: 10, andesite: 3, dirt: 2}
    # 默认 false：开启后，若命中伪装时其下方紧邻方块可用（非空气/流体、也不是目标方块），
    # 就用它作为伪装方块（与脚下地层一致，观感更自然）；下方不可用时自动退回上面的权重表随机伪装。
    use-block-below: false

  nether:                    # 地狱
    enabled: true
    mode: all
    # 默认隐藏：下界残骸、下界金矿、箱子、刷怪笼。
    # 默认不含地狱石英矿：它分布极广、价值低，藏了会让玩家挖矿到处是假石头，防护收益很小；
    # 确有需要时把它手动加进下面清单即可。
    hide-blocks:
      - ancient_debris
      - nether_gold_ore
      # —— 容器（箱子）——
      - chest
      - spawner
    replacement-weights:
      netherrack: 10
      basalt: 4
      blackstone: 3
    use-block-below: false

  the_end:                   # 末地 —— 默认关闭：末地本身没有矿物，
    enabled: false           # 需要隐藏末地城的箱子时改为 true。
    mode: all
    hide-blocks:
      - chest
    replacement-weights:
      end_stone: 10
    use-block-below: false

# ---------------------------------------------------------------------------
# 逐世界覆盖（默认空）：为单个世界（或一批世界）覆盖它所属维度的任意设置，
# 没写到的键沿用该世界所属维度的值。
#   · 名字支持精确匹配与通配（world_*）；同时命中时精确名优先，多个通配同时命中取最具体的；
#   · 可覆盖的键与 dimensions 段相同（enabled / mode / min-y / max-y / hide-blocks /
#     replacement-weights / replacement-bands / use-block-below）；
#   · 只写需要覆盖的键即可（例如某个世界只换伪装方块清单，其余全部沿用其维度）；
#   · 修改本段后，相关世界的磁盘缓存会自动失效重建（属正常现象）；
#   · 修改后执行 /mikuxraynet reload 生效。
# 示例（默认全部注释，不覆盖任何世界）：
# world-overrides:
#   world_nether:                       # 地狱某世界：换目标与伪装清单 + 限定高度
#     hide-blocks: [ancient_debris, nether_gold_ore]
#     replacement-weights: {netherrack: 10, basalt: 4, blackstone: 2}
#     min-y: 0
#     max-y: 120
#   world_the_end:                      # 末地某世界：只覆盖隐藏清单，其余回落其维度
#     hide-blocks: [end_stone_bricks, purpur_block]
#   resource_*:                         # 通配：所有 resource_ 前缀的世界用 enclosed 模式
#     mode: enclosed
world-overrides: {}

occlusion:
  # 遮挡判定的「人工纠正表」。判断一个方块是否算「挡住视线」由插件内置规则完成，
  # 若你在游戏里发现某方块被误判（表现为「该藏的矿物没藏」或「不该藏的方块被藏了」），
  # 把它的注册名填到下面两张表里——这是你自行纠正判定的唯一出口。
  # 名称用 Minecraft 注册名（小写、无需 minecraft: 前缀），填写后需重启服务端生效。
  # 注意：本段参与缓存指纹，改动后（含磁盘缓存）会整体失效重建。

  # 额外视为「遮挡」的方块（可覆盖内置规则）。示例：
  #   extra-occluding:
  #     - cobblestone_stairs      # 若你的玩法里楼梯也算遮挡
  #     - honey_block
  extra-occluding: []

  # 额外视为「不遮挡」的方块（优先级最高，压过 extra-occluding 与全部内置规则）。示例：
  #   extra-non-occluding:
  #     - chest                  # 箱子形状不满整方块，避免误判为遮挡
  #     - shulker_box
  extra-non-occluding: []

  # 默认 true：目标方块「上方紧邻方块是流体」时按被遮挡处理，保持伪装、不显形。
  # 典型场景是刷在岩浆里的下界残骸——关掉后岩浆里的残骸会直接暴露给透视端。
  # 只判断上方，且只作用于被隐藏的目标方块，不影响其它方块。
  # 本项参与缓存指纹，改动后（含磁盘缓存）会整体失效重建。
  fluid-cover: true

# ---------------------------------------------------------------------------
# 与维度无关的两个全局开关：
# ---------------------------------------------------------------------------
obfuscation:
  # true：同一高度层统一使用同一种伪装方块（更整齐）；
  # false：逐方块独立随机（更自然，也更不容易被模式识别）。
  layer-obfuscation: false

  # true：被替换掉的方块若原本带有方块实体（如箱子、刷怪笼），
  #       一并从区块封包中剔除其实体数据，防止客户端残留「隐形但能交互」的幽灵方块。
  # false：跳过剔除（省一点 CPU），封包保留服务端原发的全部方块实体数据。
  remove-block-entities: true

neighbors:
  # 是否抓取相邻区块「贴边一层」的方块数据，用于消除区块边界处那一圈不伪装的透视漏洞。
  # 只有 mode: enclosed 的世界需要（要做六面判定）；默认的 mode: all 用不到，因此完全不抓取。
  # 关闭后：区块边界方块按下方的 missing-policy 处理，最省 CPU，但边界判定精度下降。
  enabled: true

  # 邻块数据取不到时（区块未加载、跨区域、世界卸载等）的处理方式：
  #   hide   —— 视为被遮挡（默认）：宁可多伪装，不留边界漏洞；
  #   expose —— 视为暴露、不伪装：性能略好，但边界处存在可被透视利用的漏洞。
  missing-policy: hide

  # 邻块贴边数据的缓存条目上限。条目只在 mode: enclosed 时才会被用到；
  # 调大只增加内存（约 3 KB/条，默认 2048 条约 6 MB），过小会导致重复抓取、反而更耗 CPU。
  # mode: all（默认）时不抓取，本缓存会一直为空，属正常现象。
  cache-maximum-size: 2048

proximity:
  # 邻近显形：玩家靠近曾被伪装的位置时，主动把该位置的真实方块状态发回客户端。
  # 关闭后：客户端会一直看到伪装方块，直到服务端因其它原因下发该方块变更（挖到跟前才发现不对）。
  enabled: true

  # 触发还原的距离（格）。建议 6~64：太小会出现「走到跟前方块才突然变回原样」，太大等于提前把矿物亮给玩家。
  # 默认 64：还原前会做视线判定，只有真正看得见的坐标才会还原，不会隔着墙泄露。
  distance: 64.0

  # 巡检周期（tick）：数值越小显形越及时、开销略高。默认 4（0.2 秒）。
  interval-ticks: 4

  # 每次巡检最多发送的显形包数量（普通服务端为全服合计，Folia 为每名玩家各自的上限）。
  # 未轮到的坐标会保留到下次巡检，不会丢失；候选按距离由近到远处理，优先还原脚边的矿物。
  max-reveals-per-tick: 256

  # 显形记录的过期秒数（兜底）：长时间未被扫描到的记录会被清理。默认 300 秒。
  expire-seconds: 300

  # 兜底上限：正常运营下 /mxnet status 的两个「安全阀触发」计数应恒为 0，
  # 触发即说明有 bug，请连同 /mxnet dump 反馈，而不是调大这两个值。
  max-positions: 4194304
  max-positions-per-player: 524288

  # 视锥剔除：只还原玩家当前看得到的方向上的方块，省带宽；快速转身时侧后方的方块
  # 要等下一次巡检（默认 4 tick = 0.2 秒）才还原。
  # ⚠ 被剔除的坐标会继续保持伪装，所以配窄会让玩家看到「看得见却还是假方块」。
  #   想省带宽请直接关闭本项，不要把下面的角度与距离配窄——两者都有安全下限，
  #   配得更窄会被自动抬升到安全值并在控制台提示。
  frustum:
    enabled: true

    # 视野角度（度，全角，含义与客户端 FOV 设置一致）。
    # 默认 110（客户端 FOV 上限，按 16:9 屏幕覆盖其全部可视范围）。
    # 安全下限 110（低于它会被抬升到 110 并提示）；超宽屏玩家较多时可调到 120~130。
    fov: 110.0

    # 该距离（格）以内不做视锥剔除：眼前贴脸的方块必须还原。
    # 安全下限 16（低于它会被抬升到 16 并提示）；调大只会让侧后方刚进视野的方块更早还原。
    min-distance: 16.0

  # 射线可见性判定：只还原真正看得见的方块（隔着墙、隔着地层的坐标不会提前亮出来），
  # 观感最接近原版，也更不容易被透视端利用；代价是每个候选坐标要做少量射线检测（额外 CPU）。
  raycast:
    enabled: true

    # 每个方块最多尝试的检测点数（1~8）：越大越不容易漏掉「部分被埋的角落矿」，CPU 略高；
    # 越小越省 CPU，但可能漏掉部分可见的方块。默认 4。
    samples: 4

  # 即时显形（周期巡检的补充）：玩家挖开/炸开方块时，立刻还原身边因此暴露的矿物，
  # 不必等巡检周期。关闭后完全回到只靠周期巡检的行为。
  instant-reveal:
    # 总开关（默认开启）。
    enabled: true

    # 触发半径（格，1~8）：变更需发生在玩家身边该范围内才触发。
    radius: 2

    # 每名玩家每 tick 的即时显形限额（默认 16，防止连环爆炸时瞬时刷包）。
    # 未轮到的坐标由下一次巡检继续处理，不会丢失。0 = 关闭即时显形。
    max-per-tick: 16

  # 统计用：抽样估算「重复下发」的比例，只计数、不影响任何行为。默认 20（1/20 抽样）；0 = 关闭统计。
  over-reveal-sampling: 20

  # true（默认）：一个巡检周期内的显形合并成少量批量包发送，明显减少包数量；
  # false：每个坐标单独发一个包（旧行为，供对比或线上回退）。
  batch-reveal-sends: true

disk-cache:
  # 磁盘缓存：把已改写完成的区块数据存到 plugins/MikuXrayNet/cache/ 下，重启后可直接复用，
  # 省掉重复的判定与编码 CPU（首次生成的区块收益最明显）。
  # 缓存会随配置或区块内容变化自动失效重写；任何磁盘异常都会自动降级为纯内存运行，不影响正常游戏。
  # 注意：升级插件导致缓存格式变化时，旧缓存会被自动删除重建（属正常现象）。
  enabled: true

  # 缓存条目上限（每条约等于一个区块）。20000 条约占 200~600 MB 磁盘；超出后只是少缓存一些。
  max-entries: 20000

  # 单个区域文件（1024 个区块）的大小上限（MB）。
  # 达到上限后该文件暂不接受新写入，等后台维护压缩回收后继续。
  max-file-size-mb: 16

  # 条目过期秒数：从「写入时刻」开始计时，超过该时间未被复用的条目会被清理。
  # ⚠ 必须大于两次开服的间隔，否则重启后条目必然已过期、命中率恒为 0。
  # 默认 604800（7 天）；安全下限 86400（1 天，低于它会被抬升到 1 天并在控制台提示一次）。
  # 限制磁盘占用请调上面的 max-entries / max-file-size-mb，而不是把本项配短。
  expire-seconds: 604800

  # 每个已打开的区域文件在内存里缓存的 bucket 数（每个 bucket = 64 个区块槽位）。
  # 这是磁盘缓存内存占用的关键旋钮：数值越大读得越快，但驻留内存越多。默认 8。
  bucket-cache-size: 8

  # 句柄闲置多久后自动落盘并关闭（秒）：释放文件句柄与内存。
  idle-close-seconds: 300

  # 后台维护周期（秒）：落盘 + 压缩回收 + 关闭闲置句柄。数值越小越及时、开销略高。
  maintenance-interval-seconds: 30

  # 每轮维护最多压缩回收几个区域文件（限制单轮工作量，避免集中占用磁盘）。
  compact-per-pass: 4

  # 磁盘写入队列上限（条）：积压到上限后新的写入被直接丢弃（保网络路径不被拖住）。
  queue-capacity: 256

  # ---------------------------------------------------------------------------
  # zstd 压缩库：磁盘缓存用它压缩数据，缺失时自动回退到内置压缩（功能不受影响，只是压缩率略低）。
  # 开服时按顺序自动寻找：服务端自带 → 本地已下载 → 按下面配置下载 → 内置压缩；
  # 结果会在启动日志里说明（来源：服务端自带 / 新下载 / 回退内置压缩）。
  # ---------------------------------------------------------------------------

  # 缺失时是否自动下载（默认开启）。关闭后只使用服务端自带或本地已有的。
  zstd:
    auto-download: true

    # 下载源（Maven 仓库根地址，末尾不要带 /）。默认 Maven Central。
    # 国内服务器建议改用阿里云镜像：
    #   download-url: https://maven.aliyun.com/repository/public
    # 也可换成 Paper 官方镜像：
    #   download-url: https://maven-central.storage-download.googleapis.com/maven2
    download-url: https://repo1.maven.org/maven2

    # 下载总等待上限（秒）：超时即视为失败并回退内置压缩，不会长时间阻塞开服。
    timeout-seconds: 10

cache:
  # 内存缓存（改写结果）的条目上限。每条约占 20~25 KB，40960 条饱和时约 0.8~1 GB 内存。
  # 这是上限而非实际占用：条目只在遇到新区块时增长，并按下面的过期时间回收；
  # 内存吃紧就往小调，例如 16384 ≈ 340 MB。
  maximum-size: 40960

  # 条目在最后一次被使用后多久过期（秒）。默认 600（10 分钟）：
  # 玩家在同一片区域来回走动/挖矿时会持续命中同一批区块，过期时间越长命中率越高，
  # 代价是这些条目在内存里驻留更久。
  expire-after-access-seconds: 600

advanced:
  # 运行平台：auto | paper | folia（默认 auto，一般无需修改）。
  # 插件同时支持 Paper 系与 Folia 系服务端，auto 会自动识别并在启动日志说明判定结果；
  # 若你的服务端是改了品牌的衍生端而被识别错，可手工指定。本项同时影响反矿透与带宽两个模块，
  # 修改后执行 /mikuxraynet reload 生效。
  platform: auto

  # 工作线程数；0 表示按 CPU 核数自动推算（上限 4）。
  threads: 0

  # 单个区块包的处理超时（毫秒）。超时立即放行原包，避免客户端卡在加载界面。
  timeout-millis: 2500

  # 工作队列容量（条）。队列满时直接放行原包，不阻塞网络线程。
  queue-capacity: 2048