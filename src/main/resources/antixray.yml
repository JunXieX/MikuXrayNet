# ===========================================================================
#  MikuXrayNet —— 反矿透配置（按维度分段）
# ---------------------------------------------------------------------------
#  原理：出站区块封包改写。把目标方块（矿透目标）随机替换为常见的伪装方块，
#        再由「邻近显形」在玩家靠近且可见时把真实方块发回客户端。
#
#  【本版结构变更】原先的顶层 worlds（世界白名单）与顶层 obfuscation（全局方块块）
#  已合并为 dimensions 段：主世界 / 地狱 / 末地各自独立指定要隐藏的矿物、伪装方块、
#  伪装模式（all/enclosed）、高度范围与按 Y 分区伪装表。
#    · 维度由 World#getEnvironment() 判定（NORMAL/NETHER/THE_END，CUSTOM 归入 normal），
#      不依赖世界名；
#    · 解析优先级（高 → 低）：world-blacklist（世界黑名单，完全不使用反矿透）>
#      world-overrides（按世界名）> dimensions.<维度> > 内置默认；
#    · 旧键（worlds、顶层 obfuscation 的方块清单/mode/高度/分区表）已不再解析、不做迁移；
#      若本文件缺少 dimensions 段，插件会用内置默认运行并打印一次性 WARN 提示重新生成。
#
#  注意：本文件带完整中文注释，插件不会回写本文件；
#        修改后执行 /mikuxraynet reload 生效。
# ===========================================================================

# 反矿透总开关。false 时整个模块不加载，不注册任何封包拦截。
enabled: true

# ---------------------------------------------------------------------------
# 反矿透世界黑名单（world-blacklist，优先级最高，默认空列表）：
#   名单内的世界「不使用任何反矿透功能」——不改写区块、不邻近显形（周期与事件即时）、
#   不做方块变更观察、不抓邻块快照、不读也不写磁盘缓存。主城 / 副本之类不需要防透视的地图
#   放进来即可（省 CPU 与发包，也避免主城建筑被伪装）。
#   · 键名是世界名「模式」：精确名（spawn）或通配（dungeon_*，* 匹配任意字符序列）；
#   · 匹配语义与 world-overrides 一致：精确名与通配都可命中；
#   · 【优先级】黑名单高于 world-overrides：某世界既在黑名单、又在 world-overrides 里被启用，
#     仍以黑名单为准（要重新启用必须先从本名单移除该世界）；
#   · 【作用范围】只豁免反矿透。带宽模块（零位移取消 / 变更合并 / 实体剔除 / AFK 降级 /
#     高延迟降视距）不受影响，在这些世界照常生效；
#   · 修改后执行 /mikuxraynet reload 即时生效（无需重启）。
# 示例（默认空列表，不豁免任何世界）：
# world-blacklist:
#   - spawn                 # 主城：精确名
#   - dungeon_1             # 某个副本世界：精确名
#   - dungeon_*             # 所有副本世界：通配（dungeon 本身不命中，须有后缀）
world-blacklist: []

# ---------------------------------------------------------------------------
# 按维度分段：每个维度独立配置「隐藏什么、伪装成什么、怎么伪装」。
#   键说明（每个维度都可用）：
#     enabled               —— 本维度是否启用反矿透（末地无矿物，默认关闭）
#     mode                  —— all（默认，一律伪装，靠邻近显形还原）| enclosed（只伪装被完全包住的）
#     min-y / max-y         —— 可选：只在此绝对高度范围内伪装（不写 = 不限制）
#     hide-blocks           —— 要隐藏（伪装）的方块注册名清单
#     replacement-weights   —— 伪装方块与随机权重（回落表：未被 replacement-bands 覆盖的高度用它）
#     replacement-bands     —— 按 Y 分区的伪装表（仅本维度生效；配了即优先于回落表）
#     use-block-below       —— 命中伪装时优先用「下方紧邻方块」当伪装方块（默认 false）
#
#   hide-blocks 也支持 tag(...) 语法：条目写成 tag(名称) 时会在启动期展开为该 tag 下的
#   全部方块，例如 tag(diamond_ores) = diamond_ore + deepslate_diamond_ore。
#   离线无法查 Bukkit 的 tag 注册表，因此内置了一张「常用 tag 静态映射表」（_ores 系列、
#   base_stone_overworld / base_stone_nether / base_stone_end 等）；映射表之外的 tag 名会在
#   启动日志 WARN 提示并忽略该条目（不猜测成员、绝不误藏）。普通名称与 tag(...) 可混用。
# ---------------------------------------------------------------------------
dimensions:

  normal:                    # 主世界（World#getEnvironment() == NORMAL，CUSTOM 也归此类）
    enabled: true
    mode: all                # all=全部目标方块一律伪装；enclosed=仅伪装被完全包住的
    # min-y: -64             # 可选：只在此高度范围内伪装（不写=不限制）
    # max-y: 320
    # 共 35 种：16 种主世界矿石（含深层变体）+ 3 种粗金属块 + 11 种容器族 + 基岩/黑曜石/黏土
    #          + spawner（刷怪笼，真机 PE 26.2 注册名就是 spawner，旧的 mob_spawner 已不存在）
    #          + mossy_cobblestone（苔石，地牢/要塞/矿洞结构的标志物）。
    # 容器/功能方块多为方块实体：被伪装 section 内它们的方块实体本就会被 remove-block-entities
    # 剔除，与伪装逻辑不冲突（名称已用真机 PE 26.2 状态表逐一核实）。
    hide-blocks:
      - coal_ore
      - deepslate_coal_ore
      - iron_ore
      - deepslate_iron_ore
      - copper_ore
      - deepslate_copper_ore
      - gold_ore
      - deepslate_gold_ore
      - redstone_ore
      - deepslate_redstone_ore
      - lapis_ore
      - deepslate_lapis_ore
      - diamond_ore
      - deepslate_diamond_ore
      - emerald_ore
      - deepslate_emerald_ore
      - raw_iron_block
      - raw_gold_block
      - raw_copper_block
      # —— 容器/功能方块（多为方块实体，remove-block-entities 会一并剔除其数据）——
      - chest
      - trapped_chest
      - ender_chest
      - barrel
      - furnace
      - blast_furnace
      - smoker
      - hopper
      - dropper
      - dispenser
      - shulker_box
      # —— 结构暴露型方块 ——
      - bedrock
      - obsidian
      - clay
      - spawner
      - mossy_cobblestone
    # 伪装方块与随机权重（权重越大概率越高，必须为正整数）。建议只填地下常见方块，避免违和感。
    # 这是「回落表」：当 replacement-bands 未启用、或某高度未被任何分段覆盖时使用。
    replacement-weights:
      stone: 10
      deepslate: 8
    # 按 Y 分区的加权伪装表（仅本维度生效）：每个分段声明高度区间（含端点）与权重表；
    # 改写时按方块绝对 Y 找「第一个覆盖它的分段」，未落在任何分段内的高度回落 replacement-weights。
    # 用途：深层用深板岩系、浅层用石头系，伪装观感与真实地层一致，抗统计识别更强。
    # 性能：每段的累计权重表都在启动期预构建为 int 数组，热路径只有一次小数组线性扫描。
    replacement-bands:
      - min-y: -64
        max-y: -1
        weights: {deepslate: 10, tuff: 4, stone: 2}
      - min-y: 0
        max-y: 320
        weights: {stone: 10, andesite: 3, dirt: 2}
    # use-block-below（默认 false）：命中伪装时，若该方块「下方紧邻方块」可用
    # （非空气/非流体、且不是目标方块），优先用它当伪装方块（伪装与脚下地层一致，观感更自然）。
    # 下方不可用（空气/流体/真矿）时自动退回 replacement-weights 随机伪装，绝不漏伪装。
    use-block-below: false

  nether:                    # 地狱（NETHER）
    enabled: true
    mode: all
    # 共 15 种：ancient_debris（下界残骸）、nether_gold_ore（下界金矿）+ 11 种容器族 + 基岩 + 刷怪笼。
    #
    # 【本清单明确不含 nether_quartz_ore（地狱石英矿）】
    #   理由：地狱石英分布极广、单块价值极低。若把它也全藏，玩家在地狱挖矿时会到处挖到「假石头」，
    #   既严重影响观感与效率，也几乎不带来防护收益（透视端对石英矿的兴趣极低）。
    #   若你的玩法确实需要隐藏石英矿，把它手动加进下面清单即可。
    hide-blocks:
      - ancient_debris
      - nether_gold_ore
      # —— 容器/功能方块 ——
      - chest
      - trapped_chest
      - ender_chest
      - barrel
      - furnace
      - blast_furnace
      - smoker
      - hopper
      - dropper
      - dispenser
      - shulker_box
      - bedrock
      - spawner
    replacement-weights:
      netherrack: 10
      basalt: 4
      blackstone: 3
    use-block-below: false

  the_end:                   # 末地（THE_END）——默认关闭：末地本身无矿物，
    enabled: false           # 如需隐藏末地城的箱子/潜影盒再把它改为 true。
    mode: all
    # 共 12 种：11 种容器族 + 基岩。
    hide-blocks:
      - chest
      - trapped_chest
      - ender_chest
      - barrel
      - furnace
      - blast_furnace
      - smoker
      - hopper
      - dropper
      - dispenser
      - shulker_box
      - bedrock
    replacement-weights:
      end_stone: 10
    use-block-below: false

# ---------------------------------------------------------------------------
# 逐世界覆盖（world-overrides，最高优先级，默认空）：
#   为单个世界（或一批世界）覆盖其所属维度的任意子键，未覆盖的键回落「该世界所属维度」的生效值。
#   · 键名是世界名「模式」：精确名（world_nether）或通配（world_*，* 匹配任意字符）；
#   · 匹配优先级：精确名 > 通配；多个通配同时命中时取「模式最长」的（最具体）；
#   · 每个世界段下可覆盖的子键与 dimensions 段相同：
#       enabled / mode / min-y / max-y / hide-blocks / replacement-weights /
#       replacement-bands / use-block-below
#   · 只写需要覆盖的键即可（例如某个世界只换伪装方块清单，其余全部沿用其维度）；
#   · 本段影响改写结果并参与缓存指纹（不同世界各自生效，缓存互不串包）；
#     修改后执行 /mikuxraynet reload 生效。
# 下方为示例（默认全部注释，不覆盖任何世界）：
# world-overrides:
#   world_nether:                       # 地狱某世界：换目标与伪装清单 + 限定高度
#     hide-blocks: [ancient_debris, nether_gold_ore]
#     replacement-weights: {netherrack: 10, basalt: 4, blackstone: 2}
#     min-y: 0                          # 该世界的高度范围（可选，缺省不限制）
#     max-y: 120
#   world_the_end:                      # 末地某世界：只覆盖隐藏清单，其余回落其维度
#     hide-blocks: [end_stone_bricks, purpur_block]
#   resource_*:                         # 通配：所有 resource_ 前缀的世界用 enclosed 模式
#     mode: enclosed
world-overrides: {}

occlusion:
  # 遮挡判定的「人工纠正表」。内置判定用 PacketEvents 的方块语义近似：
  #   空气 / 非固体（isSolid=false）/ 形状超出整方块（exceedsCube）/ 装饰性材质（玻璃、
  #   树叶、液体、植物等）/ 薄片族名称后缀（台阶、楼梯、墙、板、门…）一律不算遮挡；
  #   双层台阶（状态属性 type=double）会被显式判为遮挡。
  # 若你的服务器上发现某个方块被误判（表现为「该藏起来的矿物没藏」或「不该藏的藏了」），
  # 就把它的注册名填到下面两张表里——这是你自行纠正判定的唯一出口。
  # 名称用 Minecraft 注册名（小写、无需 minecraft: 前缀），填写后需重启服务端生效。
  #
  # 注意：本表影响改写结果，因此参与缓存指纹；改动后（含磁盘缓存）会整体失效重建。

  # 额外视为「遮挡」的方块（可覆盖上面的内置规则）。示例：
  #   extra-occluding:
  #     - cobblestone_stairs      # 若你的玩法里楼梯也算遮挡
  #     - honey_block
  extra-occluding: []

  # 额外视为「不遮挡」的方块（优先级最高，压过 extra-occluding 与全部内置规则）。示例：
  #   extra-non-occluding:
  #     - chest                  # 箱子形状不满整方块，避免误判为遮挡
  #     - shulker_box
  extra-non-occluding: []

  # 流体覆盖（默认 true）：目标方块「上方紧邻方块是流体」时按遮挡处理（隐藏侧），
  # 且显形侧不显形（保持伪装）——典型场景是下界残骸常刷在岩浆里：若不这样处理，
  # 「上方岩浆」会被当作暴露面，残骸就不会被伪装，透视端一眼就能看到岩浆里的残骸。
  # · 覆盖的流体：岩浆与水（含静止/流动变体）以及水柱；**含水的台阶/栅栏等不算流体**
  #   （它们本体不是流体，只是含水状态）；
  # · 只判「上方」：流体几乎总是从上方淹没目标（残骸/矿脉被岩浆覆盖）；侧面的流体要么极罕见、
  #   要么本就在裸露矿洞里，若把侧面也当作遮挡反而会隐藏「本应显形」的矿；
  # · 本规则只作用于「目标方块」的判定，**不改动全局遮挡表**（不影响任何非目标方块）；
  # · 设为 false 时隐藏侧与显形侧两处规则都不生效（行为回到未引入该规则之前）。
  # 本项影响改写结果并参与缓存指纹；改动后（含磁盘缓存）会整体失效重建。
  fluid-cover: true

# ---------------------------------------------------------------------------
# 残留的全局开关（与维度无关，故不加进 dimensions）：
#   layer-obfuscation       —— 同一高度层统一使用同一种伪装方块（层状伪装，观感更整齐）
#   remove-block-entities   —— 从区块封包中剔除被伪装方块的方块实体数据（防幽灵箱子/刷怪笼）
# 说明：这两个键的位置保持与旧版一致（顶层 obfuscation 段），方块清单/mode/高度/分区表
#       等「与维度相关」的键已全部迁移到上方 dimensions 段。
# ---------------------------------------------------------------------------
obfuscation:
  # true：同一高度层统一使用同一种伪装方块（层状伪装，观感更整齐）；
  # false：逐方块独立随机（更不易被模式识别）。
  layer-obfuscation: false

  # true：被替换掉的方块若原本带有方块实体（如刷怪笼——默认隐藏清单里的 spawner 就带实体），
  #       则从区块封包中一并剔除其方块实体数据，防止客户端残留幽灵方块实体（如隐形箱子/刷怪笼）。
  # false：跳过剔除（省一次逐方块实体的比对），封包保留服务端原发的全部方块实体数据。
  remove-block-entities: true

neighbors:
  # 是否抓取 4 个水平邻区块「贴边那一层」方块，用于消除区块边界泄漏。
  # 【只在真正需要时才抓】dimensions.<维度>.mode = enclosed 的世界会抓（改写要做 6 面遮挡判定）；
  # 默认的 mode = all 一律伪装、不做面判定，邻块数据一位都用不到，因此完全不抓、也不读邻块
  #（启动日志的「区块边界邻块快照」会写明当前是「已启用」还是「不抓取」）。
  # 关闭后：区块边界那一圈方块按 missing-policy 处理，不会再读取任何邻块数据
  #（最省 CPU，但区块边界判定精度下降）。
  # 开启后（且某个维度为 enclosed）：首次遇到某个区块时会在主线程/区域线程抓取一次贴边快照，
  #          之后同区块复用缓存；世界卸载时整体失效。
  #          抓取按列裁剪：每列只读到「该列最高非空气方块」那一格为止（上界之上必为空气、必不遮挡，
  #          结果与全高度逐格读等价）。旧版全高度逐格读实测约 0.776 ms/次，裁剪后按地表高度
  #          省掉约一半的读块调用（地形越高省得越少；下界/末地接近满高）。
  enabled: true

  # 邻块数据取不到时（未加载、Folia 跨区域、世界卸载等）的策略：
  #   hide   —— 视为遮挡，宁可多伪装也不留下沿 16×16 网格线的透视口子（默认，推荐）；
  #             代价是极少数「其实暴露」的边界方块也会被伪装成石头。
  #   expose —— 视为暴露，保持「区块边界不伪装」的旧行为；性能更好但存在可利用的透视漏洞。
  missing-policy: hide

  # 邻块贴边快照的缓存条目上限。每条 = 4 个水平邻块的「贴边一层」（16 × 世界高度 格），
  # 每格只占 1 bit，故主世界 384 高度约 3 KB/条【内存代价】（同一条若按字节存约 24 KB）。
  # 默认 2048 条 ≈ 6 MB（旧默认 512 条约 1.5 MB）；上界即「上限 × 单条字节数」，条目数与世界数
  # 无关（键只含世界名与两个整数），世界卸载/热重载会整体失效。
  # 缓存未命中时会在主线程/区域线程重新抓取一次（只有 mode=enclosed 的世界会走这条路；
  # 全高度逐格读实测约 0.776 ms/次，现按列高度上界裁剪后更少），因此过小会导致重复抓取、
  # 反而更耗 CPU：真机 512 条时缓存已接近饱和，玩家走动持续淘汰旧条目，抓取次数随视距/玩家数抖动；
  # 调到 2048 后命中率提升、抓取次数收敛。调大只增加内存、不会影响正确性。
  # mode=all（默认）时不抓取，本缓存会一直为空，属正常现象。
  cache-maximum-size: 2048

proximity:
  # 邻近显形：玩家靠近「曾被伪装的坐标」时，主动把该坐标的真实方块状态发回客户端。
  # 不开时：客户端会一直看到伪装方块，直到服务端因其它原因下发方块变更（挖到跟前才发现不对）。
  # 开启后由周期任务做「局部扫描」：只遍历玩家身边 ceil(distance/16) 个区块半径内的区块
  # （distance=64 → 半径 4 → 9×9=81 个区块），把其中「曾被伪装、且该玩家还没显形过」的坐标发回客户端。
  # 坐标只会显形一次；整块都已显形的区块直接跳过（整块跳过兜底），
  # 稳态下每周期只处理「新进入视野的区块」。
  enabled: true

  # 触发显形的距离（格，三维欧氏距离，等于阈值也算命中）。建议 6~64：
  # 太小会出现「走到跟前方块才突然变回原样」，太大等于提前把矿物亮给玩家。
  # 默认 64（48 → 64，更早为 32/12）：真机反馈「48 格仍偏近、走到跟前才取消伪装」。
  # 由于显形只在射线通畅（视线真能看到、且只在暴露面上取采样点）时才还原，放大距离不会隔着墙泄露
  # ——它只是把「本来就看得到的矿」更早、更远地还给玩家。扫描半径随之从 3 变为 ceil(64/16)=4
  # （9×9=81 个区块），整块已显形的区块会被整体跳过，扫描量只与「身边还有伪装坐标的区块数」相关。
  # 取舍：越大越及时、观感越接近原版，但候选越多、发包量与每 tick 上限越相关；本项不影响隐藏强度。
  distance: 64.0

  # 巡检周期（tick）。数值越大越省 CPU，但显形越迟（4 tick = 0.2 秒）。
  # 默认 4（原为 5）：显形更及时，缩小「转身后石头还没变回来」的窗口；局部扫描已把单周期
  # 开销与探索历史脱钩，缩短周期的额外扫描量可忽略。
  interval-ticks: 4

  # 每次巡检最多发送的显形包数量（防止一次性刷包）：
  # 普通服务端为「全服合计」，Folia 为「每个玩家各自的巡检上限」。
  # 默认 256（原为 128）：配合扩大到 64 格的距离，候选数量上升，额度也要相应放大，
  # 否则脚边的矿会被远处候选挤到后面。4 tick 一次 256 个 ≈ 1280 个/秒上限，仍远低于区块包流量。
  # 未轮到发送的坐标会保留到下次巡检，不会丢失；候选按距离由近到远排序，因此总是先还原脚边的矿。
  max-reveals-per-tick: 256

  # 显形结构的过期秒数（兜底）：区块卸载事件没触发时，超过该时间且近期未被扫描到的条目会被清理。
  # 默认 300（原为 120）：登录/传送后区块是「一次性连续下发」的，玩家往往要过一会儿才走到近处；
  # 窗口太短会让「还没走到就被清掉」的坐标永不还原。玩家身边的条目会随扫描持续刷新，不会被误清。
  expire-seconds: 300

  # 安全阀（原为「显形索引容量上限」）：正常运营下这两个计数应恒为 0，触发即说明索引管理有 bug。
  # 结构重构后不再需要「按玩家容量淘汰」：
  #   · 伪装坐标按区块共享（ObfuscatedChunkIndex）——内存 = O(有伪装的已加载区块数)，与玩家数无关；
  #   · 已显形坐标按玩家记录（RevealedSet）——只记实际发过显形包的坐标，天然有界。
  # max-positions            ：伪装区块索引的坐标总量安全阀（触顶时按「最旧优先」淘汰其它区块）。
  # max-positions-per-player ：单玩家已显形坐标数的安全阀（触顶时放弃本次标记，最坏只多显形一次）。
  # 注意：这两项是「兜底」而非「调优旋钮」——/mxnet status 的显形索引行会显示「安全阀触发 X/Y」，
  #   非 0 时应连同 /mxnet dump 反馈，而不是调大上限。
  max-positions: 4194304
  max-positions-per-player: 524288

  # 视锥剔除：只显形玩家「看得到的方向」上的坐标。
  # 收益：背后/脚下的坐标不再白白发包（省带宽）。
  # 代价：快速转身时，侧后方刚进入视野的坐标要等下一次巡检（默认 4 tick = 0.2 秒）才显形，
  #       观感上可能有一瞬间的「石头还没变回来」。追求极致实时可把它关掉。
  frustum:
    enabled: true

    # 视野锥「竖直方向」全张开角（度）——含义与 Minecraft 客户端的 FOV 设置一致（默认 70，本项默认 80）。
    # 重要：这是**全角**，不是半角。判定按矩形投影（与客户端一致）分解成两轴：
    #   竖直方向：与视线俯仰之差 ≤ fov/2（80° → 40°）；
    #   水平方向：因屏幕宽高比（按 16:9 估算）而更宽，≈ 2×atan(tan(fov/2) × 16/9) ≈ 112°（半角约 56°）。
    # 修正前只按「圆锥半角 40°」判定（对水平方向过窄），真机日志显示 445/512 个候选被剔除（87%，偏高），
    # 大量「明明在屏幕里」的侧前方坐标被误剔；现在按上述两轴判定，与客户端观感一致。
    # 建议 70~110；填 0 或 >360 会被回落为 80。
    fov: 80.0

    # 该距离（格）以内的坐标豁免视锥判定：贴脸/脚下即便在视野边缘也必须显形，
    # 否则会出现「贴着走过的矿石不显形」的怪现象。
    # 取舍：越大越安全（转身时侧后方刚进视野的坐标也能立刻显形）、越小越顺滑（更接近逐格显形）；
    #       本项只豁免「视锥」判定，不影响射线遮挡判定。
    min-distance: 4.0

  # 射线可见性判定（多候选点 + Paper 原生射线）：从玩家眼睛向目标方块暴露面上的一组候选点
  # 用服务端原生 rayTraceBlocks（World#rayTraceBlocks，体素求交由服务端完成）做射线检测，
  # 任一条射线完全通畅即判为「可见」并显形；全部被挡才不显形（等玩家靠近再说）。
  # 候选点（顺序即优先级，命中即返回）：① 正对玩家的那个暴露面的中心 → ② 包围盒最近点（仅当它落在暴露面上）
  #   → ③ 该暴露面的四角中离眼睛最近的至多 3 个。每方块最多尝试的候选点数由下面的 samples 决定。
  # 关键约束：只对「暴露面」取点——先用方块遮挡表判断该方块哪些面朝向非遮挡方块，不暴露的面一个点都不采。
  # 这样彻底避免了「单点采样碰到棱角/旁边方块 → 必须贴脸才显形」的老问题（真机反馈的角落矿场景）。
  # 目标方块自身被容忍为「通畅」（候选点落在方块表面时的边界情形）；任一异常一律按「不显形」保守处理，
  # 绝不隔着墙还原。命中玻璃等非遮挡方块也算通畅（玩家确实能看见其后的方块）。
  # 收益：隔着墙、隔着地层的坐标不会提前亮出来（更接近原版观感，也更难被透视端利用）。
  # 代价：每个候选坐标要读 6 次邻块判暴露面 + 至多 samples 次原生射线（都在主线程/区域线程），属纯额外开销。
  # 默认开启（真机 dump 曾显示为 false，导致「隔着墙也把矿亮给透视客户端」）；如确不需要可关掉。
  # 另注：occlusion.fluid-cover 开启时，目标方块「上方是流体」会被判为不可见（保持伪装）；
  #       流体规则由显式读方块实现，不依赖射线。
  raycast:
    enabled: true

    # 每方块最多尝试的候选点数（注意：改用 Paper 原生射线后，本键不再表示「每条射线的采样数」）。
    # 候选点只在暴露面上按优先级取（面中心 → 最近点 → 面四角），按序检测、命中即止：
    #   越大越不容易漏判「部分掩埋的角落矿」（多点里总有一条通畅），但每方块的原生射线次数同比上升；
    #   越小越省 CPU，但可能因唯一候选点恰好压在相邻方块那一侧而漏显形。
    # 钳制范围 1~8；默认 4（够覆盖面中心 + 最近点 + 两个面角，兼顾命中率与开销）。
    samples: 4

  # 事件驱动即时显形（周期巡检的「补充」，周期兜底不变）：插件在出站封包里观测到方块变更
  #（挖开/爆炸/活塞等，服务端自己下发的 BLOCK_CHANGE / MULTI_BLOCK_CHANGE）时，若该变更落在
  # 玩家身边（曼哈顿距离 ≤ radius）且变更邻域内仍有伪装坐标，就「当 tick」把邻域内
  # 「已伪装且视线可见」的坐标显形——不再等最多 interval-ticks（0.2 秒）的巡检窗口。
  # 与周期巡检共用同一套显形链路（射线判定 / 已显形标记 / 统计）：同一坐标当 tick 只发一次，
  # 周期巡检也会跳过已显形坐标，两者不会重复发包；变更在半径外等事件路径触不到的场景仍由周期兜底。
  instant-reveal:
    # 总开关（默认开启；关闭后完全回到纯周期巡检行为）。
    enabled: true

    # 曼哈顿半径（格）：变更必须落在玩家身边该半径内才触发（默认 2，与竞品 updateRadius 一致）。
    # 半径越大，越远处的爆炸也能即时修复，但单次邻域评估量按立方增长；钳制范围 1~8。
    radius: 2

    # 每玩家每 tick 事件显形限额（默认 16，防爆刷：TNT 连爆时最多每 tick 补发 16 个真实方块）。
    # 未轮到的坐标保留在伪装清单里，由下一 tick 的限额或周期巡检继续显形，不会丢失。0 = 关闭事件显形。
    max-per-tick: 16

  # 过度显形量化（只计数、不改任何行为）：显形发包前按 1/N 抽样，若「已显形集合」已含该坐标
  #（说明客户端应已可见，该包是浪费的），按「过度」计数。/mxnet status 与 dump 会显示
  # 「过度显形（抽样） X / 抽样 Y」——X/Y 即浪费占比的无偏估计（样本足够大时），
  # 用于评估是否需要收紧显形策略。默认 20（1/20 抽样，开销可忽略）；0 = 关闭统计。
  over-reveal-sampling: 20

  # 批量合并显形包（默认 true）：把一个巡检周期内通过筛选的显形坐标累积起来，
  # 周期末用 Paper 原生多方块变更包（Player#sendMultiBlockChange）一次发出。
  #   · Paper 会按 16×16×16 区块段自行合并，因此「本周期 N 个显形」通常只产生「涉及的段数」个包
  #     （旧实现是每坐标一个单方块变更包，N 个坐标就是 N 个包）；
  #   · 只有一个坐标时自动用单方块变更包（更小，行为与旧版一致）；
  #   · 批量调用整体失败时自动退化为逐坐标 Player#sendBlockChange，失败只记日志并跳过，
  #     不影响其它坐标与反矿透主流程（fail-open）；
  #   · 显形包一律走 Paper 原生通道（不经封包自拼）；注意它仍会被本插件的出站方块变更观察链路
  #     看到（那正是「变更注销」计数的主要来源）。插件按「自己的显形回显」对其记账：只摘显形索引、
  #     不推进磁盘缓存区块代次——否则每次显形都会作废该区块的缓存条目，玩家身边等于没有磁盘缓存。
  # 关掉本项即回到「逐坐标单包」的旧行为，供 A/B 对比与线上回退（默认开启）。
  batch-reveal-sends: true

disk-cache:
  # 磁盘缓存：把「已改写完成的区块负载」持久化到
  #   plugins/MikuXrayNet/cache/<世界名>/r.<regionX>.<regionZ>.b_linear
  # （32×32 区块一个文件，格式为 BufferedLinearV3 的 bucket 布局，压缩用服务端自带的 zstd）。
  # 负载里带有「被伪装坐标清单」，因此磁盘缓存命中的区块同样会进入显形索引（否则靠近也不还原）。
  # 格式版本 0x04：升级后 0x03 旧文件会被明确拒绝并删除重建（只提示一次），属正常现象。
  # 收益：重启后同一区块（原始字节指纹 + 配置指纹 + 区块代次都一致时）可直接复用，
  #       省掉重复的解码、遮挡判定与重编码 CPU（首次生成的区块收益最明显）。
  # 代价：额外的磁盘写入与占用，以及维护线程的少量 CPU；缓存永远是「可选加速」，
  #       任何磁盘异常都会自动降级为纯内存路径，绝不影响封包链路（fail-open）。
  #
  # 失效规则：键包含 (世界名, chunkX, chunkZ, 配置指纹, 区块代次)。某区块内观测到
  # 方块变更（出站 BLOCK_CHANGE/MULTI_BLOCK_CHANGE）时递增其区块代次，旧代次条目
  # 读取时判定为未命中并被惰性清理；另有条目过期时间兜底。
  # 注意：本版配置结构变更会让配置指纹变化，旧磁盘缓存会一次性失效重建（属正常现象）。
  enabled: true

  # 近似条目总数上限（每条约等于一个区块的负载字节）。超出后拒绝新写入（只是少缓存一些）。
  # 20000 条约对应 20000 个区块；按平均 10~30 KB/条估算约 200~600 MB 磁盘占用。
  max-entries: 20000

  # 单个区域文件（32×32 = 1024 个区块）的大小上限（MB）。
  # 达到上限后该文件暂不接受新写入，等后台维护压缩回收（丢弃垃圾与过期条目）腾出空间。
  # 计数同时包含「已落盘字节」与「已接受但尚未 append 的待写字节」（bucket 是整块追加的）。
  max-file-size-mb: 16

  # 条目过期秒数：超过该时间未被重写的条目在读取与后台维护时被清理（默认 30 分钟）。
  expire-seconds: 1800

  # 每个打开的区域文件在内存里缓存的 bucket 数（每个 bucket = 64 个区块槽位）。
  # 这是内存占用的关键旋钮：数值越大读命中越快，但持有的字节越多。
  # 默认 8（原为 2）：真机数据下 bucket 缓存把「重复打开/重解码同一 bucket」的次数压掉约 16~20%
  # （命中率提升 16~20 个百分点），而多驻留 6 个 bucket（≈6×64 槽的负载字节）的内存在
  # idle-close-seconds 的闲置关闭与 max-file-size-mb 的单文件上限双重护栏下可控。
  bucket-cache-size: 8

  # 句柄闲置多久后自动落盘并关闭（秒）：释放文件描述符与内存，避免随世界规模增长。
  idle-close-seconds: 300

  # 后台维护周期（秒）：落盘 + 压缩回收 + 关闭闲置句柄。数值越小越及时、开销略高。
  maintenance-interval-seconds: 30

  # 每轮维护最多压缩回收几个区域文件（限制单轮工作量，避免集中 IO）。
  compact-per-pass: 4

  # 磁盘线程待处理任务上限（条）：积压到上限后新的写请求被直接丢弃（保网络路径不被拖住）。
  queue-capacity: 256

  # 区块代次跟踪表的条目上限（有界 LRU）。被挤出的区块退化为「代次 0」，
  # 最多多一次未命中、不会返回脏数据（读写双方还会校验原始字节指纹与配置指纹）。
  generation-tracker-size: 32768

  # ---------------------------------------------------------------------------
  # zstd 前置（压缩算法库）的自动识别与自动下载。
  #
  # 磁盘缓存的 bucket 压缩用 zstd（比内置 Deflater 压缩率更好）。它是一个「前置库」，
  # 开服时会按以下顺序自动解析（见 cache/ZstdSupport）：
  #   ① 服务端自带（Leaf/Paper 26.x 内置 zstd-jni，插件类加载器直接可见）——真机走这一条，无需下载；
  #   ② plugins/MikuXrayNet/lib/ 下上次启动已下载的 jar；
  #   ③ 按下面三键自动下载到 plugins/MikuXrayNet/lib/；
  #   ④ 都不可用 → 自动回退内置 Deflater（磁盘缓存仍可用，只是压缩率略低，属 fail-open）。
  # 三种来源都会在启动日志里一次性（中文）说清三件事：检测到的平台、推导出的分类器、最终来源，例如
  #   ZSTD 前置：平台 windows/amd64 → 分类器 win_amd64；来源=服务端自带
  #   ZSTD 前置：平台 windows/amd64 → 分类器 win_amd64；来源=新下载（win_amd64，401 KB）
  #   ZSTD 前置：平台 sunos/sparc → 分类器未识别，将尝试全平台包；自动下载失败，已回退内置压缩
  # 分类器取自 zstd-jni 实际发布的平台包名（32 位 Linux=linux_i386、Windows=win_x86），不识别则退回全平台包。
  # ---------------------------------------------------------------------------

  # zstd 前置缺失时是否自动下载（默认开启）。关闭后只尝试①②，都没有就用内置压缩。
  # 下载与加载都在启动期一次完成，失败只告警、绝不影响插件加载与封包链路。
  zstd:
    auto-download: true

    # zstd 下载源根地址（Maven 仓库根，末尾不要带 /）。
    # 默认 Maven Central（https://repo1.maven.org/maven2）。
    # 【国内服务器建议换成阿里云镜像】（本机 Leaf 启动参数 -DLeaf.library-download-repo 用的就是它）：
    #   download-url: https://maven.aliyun.com/repository/public
    # 也可以换成 Paper 的官方镜像：
    #   download-url: https://maven-central.storage-download.googleapis.com/maven2
    # 下载的坐标固定为 com.github.luben:zstd-jni:1.5.7-15（与真机 Leaf 26.2 自带版本一致，
    # 因此绝大多数服务器会命中①②，根本不会发起下载）。
    # 下载时优先取「平台专用包」（如 linux_amd64，实测 401 KB），取不到再退「全平台包」（实测 6.15 MB）：
    # 两者类与 API 完全一致，只是全平台包多带了各系统的原生库。
    download-url: https://repo1.maven.org/maven2

    # 下载的总等待上限（秒）：连接超时、读取超时与总等待都受它约束。
    # 超时即视为失败并回退内置压缩（fail-open，绝不长时间阻塞开服）。
    timeout-seconds: 10

cache:
  # 改写结果缓存的条目上限（每条约等于一个区块的字节数）。
  maximum-size: 4096

  # 缓存条目在最后一次访问后多久过期（秒）。
  expire-after-access-seconds: 60

advanced:
  # 平台判定兜底：auto | paper | folia（默认 auto，最高优先级）。
  # 本插件同时支持 Paper 系（单主线程、常规 Bukkit 调度）与 Folia 系（区域化多线程、区域调度器）。
  # auto 时判定顺序为：品牌/版本标识 → 判别类探测，并在启动日志里打印判定依据，例如：
  #   运行平台：Leaf 26.2（Paper 系，单主线程）｜判定依据：品牌=Leaf（不含 folia 标识）；
  #             判别类 io.papermc.paper.threadedregions.RegionizedServer 不存在 → Paper 系
  #   运行平台：Lophine 26.3（Folia 系，区域化多线程）｜判定依据：品牌=Lophine（不含 folia 标识）；
  #             判别类 io.papermc.paper.threadedregions.RegionizedServer 存在 → Folia 系（Folia 衍生端）
  # 判别类取 Folia 的「服务端实现类」RegionizedServer：实测 Lophine 26.3 有，而 Leaf 26.2 与
  # paper-api 26.2 都没有（它们只自带 Folia 调度器 API 与 RegionizedServerInitEvent）。
  # 因此不能用 RegionizedServerInitEvent / 「包内任一类存在」来判断——那会把 Leaf 误判成 Folia。
  # 若你的服务端是改了品牌的 Folia 衍生端（标识里没有 folia 且判别类探测也失效），把它设为 folia
  # 即可强制走 Folia 路径；反之若某个分支误报 folia，设为 paper。本项全局生效（同时影响反矿透与
  # 带宽两个模块），改后执行 /mikuxraynet reload 生效（会按新值重新判定并重建周期任务）。
  platform: auto

  # 工作线程数；0 表示按 CPU 核数自动推算（上限 4）。
  threads: 0

  # 单个区块包的处理超时（毫秒）。超时立即放行原包，避免客户端卡在加载界面。
  timeout-millis: 2500

  # 工作队列容量（条）。队列满时直接放行原包，不阻塞网络线程。
  queue-capacity: 2048