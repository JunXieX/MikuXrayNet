# ===========================================================================
#  MikuXrayNet —— 反矿透配置（按维度分段）
# ---------------------------------------------------------------------------
#  作用：把埋在地下（四面被包住）的矿物、箱子、刷怪笼等替换成普通方块发给客户端，
#        玩家走近且真正看得见时才还原为真实方块，让透视端「看不到真矿」。
#
#  配置结构：
#    · dimensions      —— 主世界 / 地狱 / 末地分别配置：隐藏什么、伪装成什么、怎么伪装；
#    · world-overrides —— 为单个世界单独覆盖它所属维度的设置；
#    · 生效优先级（高 → 低）：world-overrides > dimensions > 内置默认。
#
#  注：世界黑名单已迁出为独立文件 blacklist.yml（对反矿透与带宽优化同时生效），本文件不再包含它。
#
#  本文件不会被插件回写；修改后执行 /mikuxraynet reload 生效。
# ===========================================================================

# 反矿透总开关。false = 整个模块关闭，所有世界都不做伪装。
enabled: true

# ---------------------------------------------------------------------------
# 按维度分段：每个维度单独配置「隐藏什么、伪装成什么、怎么伪装」。
#   可用子键：
#     enabled             —— 本维度是否启用反矿透
#     mode                —— all（默认，所有目标方块都伪装，靠邻近显形还原）
#                            | enclosed（只伪装六面都被包住的，暴露在洞穴里的保持原样）
#     min-y / max-y       —— 可选：只在该高度范围内伪装（不写 = 不限制）。
#                            只接受整数（可带正负号）；写成带引号的 "64" 或浮点 64.0 会被忽略
#                            （= 不限制）并在控制台提示一次，不会被悄悄当成 0 把范围收窄成 [0,0]
#     hide-blocks         —— 要隐藏的方块清单（填方块注册名）
#     replacement-weights —— 伪装方块与随机权重（权重越大出现越多，须为正整数）
#     replacement-bands   —— 按高度分层指定伪装表（配了即优先于上面的回落表）
#     use-block-below     —— 是否优先用下方紧邻方块作为伪装方块（默认 false）
#
#   hide-blocks 支持 tag(...) 写法：例如 tag(diamond_ores) 会自动展开为钻石矿 + 深层钻石矿。
#   插件内置常用 tag 映射（各类 _ores、base_stone_overworld / base_stone_nether /
#   base_stone_end 等）；不认识的 tag 会在启动日志提示并忽略该条目（不会误藏其它方块）。
#   普通名称与 tag(...) 可以混用。
#
#   ★ hide-blocks 空清单的语义（与 world-overrides 相反，务必看清）：
#       在本 dimensions 段里，把 hide-blocks 显式写成空列表 [] 或不写，效果相同——
#       都「回落该维度的内置默认清单」（即仍然隐藏默认那批方块），而不是「一个都不藏」。
#       （这是刻意的：避免服主手滑配空导致该维度悄悄完全不伪装。）
#       若确实想让某维度「一个方块都不隐藏」，请用 world-overrides 对具体世界覆盖为 []（见文末说明）。
# ---------------------------------------------------------------------------
dimensions:

  normal:                    # 主世界
    enabled: true
    mode: all                # all=全部伪装；enclosed=仅伪装被完全包住的
    # min-y: -64             # 可选：只在此高度范围内伪装（不写=不限制）
    # max-y: 320
    # 默认隐藏：16 种主世界矿石（含深层变体）+ 3 种粗金属块 + 箱子 + 刷怪笼 + 苔石。
    # 默认不隐藏：桶/熔炉族/漏斗/发射器/投掷器/潜影盒/末影箱/陷阱箱（可制造、遍布建筑，
    #              藏它们只会到处出现假方块）以及基岩/黑曜石/黏土（自然方块，透视价值低）。
    # 需要时把对应注册名加进下面清单即可。
    hide-blocks:
      - coal_ore
      - deepslate_coal_ore
      - iron_ore
      - deepslate_iron_ore
      - copper_ore
      - deepslate_copper_ore
      - gold_ore
      - deepslate_gold_ore
      - redstone_ore
      - deepslate_redstone_ore
      - lapis_ore
      - deepslate_lapis_ore
      - diamond_ore
      - deepslate_diamond_ore
      - emerald_ore
      - deepslate_emerald_ore
      - raw_iron_block
      - raw_gold_block
      - raw_copper_block
      # —— 容器（箱子：透视端最想找的目标）——
      - chest
      # —— 结构暴露型方块 ——
      - spawner
      - mossy_cobblestone
    # 伪装方块与随机权重（权重越大概率越高，须为正整数）。建议只填地下常见方块，避免违和感。
    # 这是「回落表」：当 replacement-bands 未启用、或某高度未被任何分段覆盖时使用。
    replacement-weights:
      stone: 10
      deepslate: 8
    # 按高度分层的伪装表（仅本维度生效）：每个分段声明高度区间（含端点）与权重表；
    # 未被任何分段覆盖的高度使用上面的 replacement-weights。
    # 用途：深层伪装成深板岩系、浅层伪装成石头系，观感更接近真实地层。
    replacement-bands:
      - min-y: -64
        max-y: -1
        weights: {deepslate: 10, tuff: 4, stone: 2}
      - min-y: 0
        max-y: 320
        weights: {stone: 10, andesite: 3, dirt: 2}
    # 默认 false：开启后，若命中伪装时其下方紧邻方块可用（非空气/流体、也不是目标方块），
    # 就用它作为伪装方块（与脚下地层一致，观感更自然）；下方不可用时自动退回上面的权重表随机伪装。
    use-block-below: false

  nether:                    # 地狱
    enabled: true
    mode: all
    # 默认隐藏：下界残骸、下界金矿、箱子、刷怪笼。
    # 默认不含地狱石英矿：它分布极广、价值低，藏了会让玩家挖矿到处是假石头，防护收益很小；
    # 确有需要时把它手动加进下面清单即可。
    hide-blocks:
      - ancient_debris
      - nether_gold_ore
      # —— 容器（箱子）——
      - chest
      - spawner
    replacement-weights:
      netherrack: 10
      basalt: 4
      blackstone: 3
    use-block-below: false

  the_end:                   # 末地 —— 默认关闭：末地本身没有矿物，
    enabled: false           # 需要隐藏末地城的箱子时改为 true。
    mode: all
    hide-blocks:
      - chest
    replacement-weights:
      end_stone: 10
    use-block-below: false

# ---------------------------------------------------------------------------
# 逐世界覆盖（默认空）：为单个世界（或一批世界）覆盖它所属维度的任意设置，
# 没写到的键沿用该世界所属维度的值。
#   · 名字支持精确匹配与通配（world_*）；同时命中时精确名优先，多个通配同时命中取最具体的；
#   · 可覆盖的键与 dimensions 段相同（enabled / mode / min-y / max-y / hide-blocks /
#     replacement-weights / replacement-bands / use-block-below）；
#   · enabled 在这里表示「该世界是否启用反矿透」，会覆盖所属维度的 enabled：
#       enabled: false —— 该世界完全不伪装（即使其维度是启用的；常用于主城 / 小游戏世界）；
#       enabled: true  —— 该世界启用（即使其维度是关闭的，例如默认关闭的末地）；
#       不写           —— 沿用所属维度（维度关闭时该世界同样不启用；要在关闭的维度里
#                         单独启用某个世界，必须显式写 enabled: true）。
#     注意：blacklist.yml 的世界黑名单优先级仍然最高——名单内的世界即使这里写 enabled: true
#     也不会启用（要启用须先从黑名单移除）。
#   · min-y / max-y 只接受整数（可带正负号）；写成带引号的 "64" 或浮点 64.0 会被忽略
#     （= 不限制）并在控制台提示一次，不会被悄悄当成 0 把高度范围收窄成 [0,0]。
#   · 只写需要覆盖的键即可（例如某个世界只换伪装方块清单，其余全部沿用其维度）；
#
#   ★ hide-blocks 空清单在这里的语义与 dimensions 段相反（务必看清）：
#       在 world-overrides 里把 hide-blocks 显式写成 [] 表示「覆盖为空清单 = 该世界一个方块都不隐藏」
#       （例如主城世界配 hide-blocks: [] 即完全不伪装）；不写 hide-blocks 才表示「沿用其维度」。
#       注意：若该世界还在 blacklist.yml 里，则以黑名单为准（同样是完全不反矿透与带宽优化）。
#   · 修改本段后，相关世界的磁盘缓存会自动失效重建（属正常现象）；
#   · 修改后执行 /mikuxraynet reload 生效。
# 示例（默认全部注释，不覆盖任何世界）：
# world-overrides:
#   main_hub:                           # 主城世界：关闭反矿透（其余设置仍沿用主世界维度）
#     enabled: false
#   world_nether:                       # 地狱某世界：换目标与伪装清单 + 限定高度
#     hide-blocks: [ancient_debris, nether_gold_ore]
#     replacement-weights: {netherrack: 10, basalt: 4, blackstone: 2}
#     min-y: 0
#     max-y: 120
#   world_the_end:                      # 末地某世界：末地维度默认关闭，必须显式启用
#     enabled: true
#     hide-blocks: [end_stone_bricks, purpur_block]
#   resource_*:                         # 通配：所有 resource_ 前缀的世界用 enclosed 模式
#     mode: enclosed
world-overrides: {}

occlusion:
  # 遮挡判定的「人工纠正表」。
  # 判定口径（自 1.11.18 起改为「逐状态真值」）：优先由服务端解析每个方块状态得到
  #   BlockData#isOccluding()（vanilla 逐状态语义，即「玩家视觉能否看穿」）。
  #   个别状态解析失败时，才回落插件内置的 PE 状态语义启发式（此时才可能出现旧口径的粗糙判定）。
  # 若你在游戏里发现某方块被误判（表现为「该藏的矿物没藏」或「不该藏的方块被藏了」），
  # 把它的注册名填到下面两张表里——这是你自行纠正判定的唯一出口（优先级最高，压过逐状态真值）。
  # 名称用 Minecraft 注册名（小写、无需 minecraft: 前缀），填写后需重启服务端生效。
  # 注意：本段参与缓存指纹，改动后（含磁盘缓存）会整体失效重建。
  #
  # 【作用范围】本表只影响「反矿透伪装」的判定。实体遮挡（带宽模块的实体剔除）与伪装口径现在
  #   **同源**（同一逐状态真值，仅不含本表覆盖），因此不会出现「同一格两种结论」的漂移。
  #   启动期会打印两行日志——「逐状态真值解析成功 / 回落启发式 / 覆盖表命中 / 构建耗时」与
  #   「两套口径一致性（无覆盖时应为 0）」，据此核对即可。

  # 额外视为「遮挡」的方块（可覆盖逐状态真值与回落规则）。示例：
  #   extra-occluding:
  #     - cobblestone_stairs      # 若你的玩法里楼梯也算遮挡
  #     - honey_block
  extra-occluding: []

  # 额外视为「不遮挡」的方块（优先级最高，压过 extra-occluding、逐状态真值与全部回落规则）。示例：
  #   extra-non-occluding:
  #     - chest                  # 箱子形状不满整方块，避免误判为遮挡
  #     - shulker_box
  extra-non-occluding: []

  # 岩浆默认按「视觉遮挡」处理：岩浆视觉上不透明，服务端 isOccluding() 却返回 false
  # （非满方块、光会穿过）。因此它由唯一规则入口 OcclusionRules 补判为遮挡，并并入共享遮挡位图——
  # 实体剔除、显形（位图/降级射线）、方块补丁四条路径自动一致。典型场景是刷在岩浆里的下界残骸：
  # 玩家看不到岩浆后方的实体/方块是正常的，透视端同样不该看到。
  # 如需关闭该行为（仅作用于反矿透伪装）：把 lava 填进上面的 extra-non-occluding；
  # 注意实体剔除/显形走实体口径（不含覆盖表），不受此改动影响，届时两者对岩浆的结论会不一致。
  # 水（含流动变体与水柱）是透明的，不计入遮挡：玩家在矿洞里应当能看见被水盖住的矿物。

# ---------------------------------------------------------------------------
# 与维度无关的两个全局开关：
# ---------------------------------------------------------------------------
obfuscation:
  # true：同一高度层统一使用同一种伪装方块（更整齐）；
  # false：逐方块独立随机（更自然，也更不容易被模式识别）。
  layer-obfuscation: false

  # true：被替换掉的方块若原本带有方块实体（如箱子、刷怪笼），
  #       一并从区块封包中剔除其实体数据，防止客户端残留「隐形但能交互」的幽灵方块。
  # false：跳过剔除（省一点 CPU），封包保留服务端原发的全部方块实体数据。
  remove-block-entities: true

neighbors:
  # 是否抓取相邻区块「贴边一层」的方块数据，用于消除区块边界处那一圈不伪装的透视漏洞。
  # 只有 mode: enclosed 的世界需要（要做六面判定）；默认的 mode: all 用不到，因此完全不抓取。
  # 关闭后：区块边界方块按下方的 missing-policy 处理，最省 CPU，但边界判定精度下降。
  enabled: true

  # 邻块数据取不到时（区块未加载、跨区域、世界卸载等）的处理方式：
  #   hide   —— 视为被遮挡（默认）：宁可多伪装，不留边界漏洞；
  #   expose —— 视为暴露、不伪装：性能略好，但边界处存在可被透视利用的漏洞。
  missing-policy: hide

  # 邻块贴边数据的缓存条目上限。条目只在 mode: enclosed 时才会被用到；
  # 调大只增加内存（约 3 KB/条，默认 2048 条约 6 MB），过小会导致重复抓取、反而更耗 CPU。
  # 下限 1；上限 16384（约 48 MB，再大只放大内存占用而无精度收益，超过会被钳制并提示一次）。
  # mode: all（默认）时不抓取，本缓存会一直为空，属正常现象。
  cache-maximum-size: 2048

proximity:
  # 邻近显形：玩家靠近曾被伪装的位置时，主动把该位置的真实方块状态发回客户端。
  # 关闭后：客户端会一直看到伪装方块，直到服务端因其它原因下发该方块变更（挖到跟前才发现不对）。
  enabled: true

  # 显形半径，单位是【区块】（= 视距单位）。
  # 默认 0 = 跟随服务器视距：读取 server.properties 的 view-distance（若某世界在 world 级配置里覆盖过，
  #   则用该世界的生效值），并再与玩家客户端自报的视距取小值。
  #   这样做是为了保证「发出去的显形包客户端一定收得到」——显形包只有在客户端已加载该区块时才生效，
  #   超出视距的包会被客户端直接丢弃（白费带宽，还可能让已显形标记落在客户端没见过的坐标上）。
  # 正数 = 最多向外显形这么多个区块；同样会被钳制到玩家有效视距，所以实际半径不会超过视距。
  # 上限 32（Minecraft 允许的最大视距）：超过会被钳制到 32 并在控制台提示一次。
  # 提示：显形前仍会做视线判定，只有真正看得见的坐标才会还原，不会隔着墙泄露。
  distance-chunks: 0

  # 巡检周期（tick）：数值越小显形越及时、开销略高。默认 4（0.2 秒）。
  interval-ticks: 4

  # 每次巡检最多发送的显形包数量（普通服务端为全服合计，Folia 为每名玩家各自的上限）。
  # 未轮到的坐标会保留到下次巡检，不会丢失；候选按距离由近到远处理，优先还原脚边的矿物。
  # 默认 512：配合按视距的显形半径，单周期通过筛选的坐标更多，额度太小会让近处的矿排队到下一周期。
  max-reveals-per-tick: 512

  # 【本项现在只影响「按玩家的已显形记录」，不再影响「伪装坐标清单」】
  #   · 伪装坐标清单改为「只随区块卸载清理」：区块卸载意味着附近已无玩家，条目随即释放，
  #     内存因此仍有界（驻留量 ≈ 已加载且被改写过的区块数）。
  #     为什么不按时间过期：玩家走远超过该秒数又折返时，区块若未重新下发，清单已丢——
  #     那些矿就再也不会被显形，玩家会一直看到假方块（折返是极常见的操作）。
  #   · 已显形记录仍按本项过期：它按玩家记录，玩家长期不下线时不清会无界增长；
  #     过期只意味着「可能重复显形一次」（浪费一点带宽），不会让玩家看到假方块。
  # 默认 300 秒。
  expire-seconds: 300

  # 兜底上限：正常运营下 /mxnet status 的两个「安全阀触发」计数应恒为 0，
  # 触发即说明有 bug，请连同 /mxnet dump 反馈，而不是调大这两个值。
  max-positions: 4194304
  max-positions-per-player: 524288

  # 视锥剔除：只还原玩家当前看得到的方向上的方块，省带宽；快速转身时侧后方的方块
  # 要等下一次巡检（默认 4 tick = 0.2 秒）才还原。
  # ⚠ 被剔除的坐标会继续保持伪装，所以配窄会让玩家看到「看得见却还是假方块」。
  #   想省带宽请直接关闭本项，不要把下面的角度与距离配窄——两者都有安全下限，
  #   配得更窄会被自动抬升到安全值并在控制台提示。
  frustum:
    enabled: true

    # 视野角度（度，全角，含义与客户端 FOV 设置一致）。
    # 默认 120（比下限宽 10°）：下限 110 保证「16:9 屏幕的合法可视区不被剔除」，默认再宽一些以覆盖
    # 更宽的屏幕（21:9 等）与转头瞬间的迟滞窗口，尽量不出现「看得见却还是假方块」。
    # 安全下限 110（低于它会被抬升到 110 并提示）；超宽屏玩家较多时可调到 120~130。
    fov: 120.0

    # 该距离（格）以内不做视锥剔除：眼前贴脸的方块必须还原。
    # 默认 24（= 1.5 个区块，比下限宽 8 格）；安全下限 16（低于它会被抬升到 16 并提示）；
    # 调大只会让侧后方刚进视野的方块更早还原。
    min-distance: 24.0

  # 射线可见性判定：只还原真正看得见的方块（隔着墙、隔着地层的坐标不会提前亮出来），
  # 观感最接近原版，也更不容易被透视端利用；代价是每个候选坐标要做少量射线检测（额外 CPU）。
  raycast:
    enabled: true

    # 每个方块最多尝试的检测点数（1~5）：越大越不容易漏掉「部分被埋的角落矿」，CPU 略高；
    # 越小越省 CPU，但可能漏掉部分可见的方块。默认 5（= 上限，多试一个面角）。
    # 上限就是「暴露面上的候选点数」5（面中心 + 最近点 + 至多 3 个面角）；配 6~8 不会多试出第 6 个点，
    # 属静默失效，故超过 5 会被钳制到 5。
    samples: 5

  # 即时显形（周期巡检的补充）：玩家挖开/炸开方块时，立刻还原身边因此暴露的矿物，
  # 不必等巡检周期。关闭后完全回到只靠周期巡检的行为。
  instant-reveal:
    # 总开关（默认开启）。
    enabled: true

    # 开掘即预显形（默认开启）：玩家开始挖某个方块时，先把它 6 邻里「挖开后会看见」的伪装坐标还原。
    # 客户端对挖掘有本地预测（方块一破就立刻用本地状态渲染），等方块破坏后再补发必然晚一个网络往返，
    # 那一瞬间玩家会看到邻接的伪装方块（矿石/箱子「凭空出现」）。提前到「开始挖」发，正常挖掘速度下
    # 显形包会先于方块破坏到达客户端，玩家就看不到假方块。
    # 代价：只在玩家主动挖的那一格周围生效；若挖到一半取消，那几格会保持已还原（它们此刻仍被遮住，
    # 但透视端可见），窗口 = 本次挖掘时长。关掉即回到「破坏后再补发」。
    pre-reveal-on-dig: true

    # 触发半径（格，1~8）：变更需发生在玩家身边该范围内才触发。默认 4（= 半个区块边长），
    # 挖开一处后连带还原的范围更大；判定量随半径三次方增长，不建议调到 8。
    radius: 4

    # 每名玩家每 tick 的即时显形限额（默认 16，防止连环爆炸时瞬时刷包）。
    # 未轮到的坐标由下一次巡检继续处理，不会丢失。0 = 关闭即时显形。
    max-per-tick: 16

  # 统计用：抽样估算「重复下发」的比例，只计数、不影响任何行为。默认 20（1/20 抽样）；0 = 关闭统计。
  over-reveal-sampling: 20

  # true（默认）：一个巡检周期内的显形合并成少量批量包发送，明显减少包数量；
  # false：每个坐标单独发一个包（旧行为，供对比或线上回退）。
  batch-reveal-sends: true

  # 区块下发即显形（默认开启）：每个区块包放行之后，立即把该区块中「玩家当前看得见」的伪装坐标补发下去。
  # 区块包本身是共享的伪装版本（磁盘缓存/多玩家复用），所以不能按玩家定制负载；这里是在其后紧跟一个
  # 小批量显形包，客户端通常在同一 tick 内先后应用，于是不会出现「区块先是一片石头、过一会儿矿才冒出来」。
  # 关闭后回到「等下一轮巡检（最坏约 0.8 秒）才还原」的旧行为。
  reveal-on-chunk-send: true

  # 视野变化增量巡检（默认开启）：玩家移动/转向超过阈值时，当 tick 对近场补做一次受限增量扫描，
  # 把「刚进入视野」的伪装坐标立刻还原。
  # 为什么需要：周期巡检按分片轮转，单个区块最坏要 4 个周期（约 0.8 秒）才轮到；转身/绕过拐角时
  # 这 0.8 秒里看到的是合理的假方块（石头），会有「矿凭空出现」的观感。本项把它压到 ≤ 冷却+1 tick。
  # 成本由下面三项硬性封顶（另有代码常量：单次候选 ≤32、每 tick 发包 ≤16），超限只少补几个，
  # 剩余交给周期巡检兜底，绝不无界。
  view-change:
    # 总开关（默认开启）。关闭后回到「只靠周期巡检（最坏 0.8 秒）」的行为。
    enabled: true

    # 每玩家每 tick 的耗时预算（毫秒）。默认 0.3；下限 0.05（再小几乎判不完一个候选）、上限 2.0
    # （再大就不是「补漏」而是把周期巡检的活搬到事件路径上）。越界会被钳制并在控制台提示。
    # 默认值按实机数据定：0.15 时「预算耗尽」占 17%（密集矿区约 1/6 的转身补显形被截断）；
    # 0.3 时 40 人同帧都触发的理论上限 ≈ 12 ms，实际触发频率远低于每 tick 且只在有候选时才花。
    budget-ms: 0.3

    # 同一玩家两次增量巡检的最小间隔（tick）。默认 2（最坏补发延迟 ≈ 100 ms）；钳制 1~20。
    # 调大更省 CPU，但「转身看到假方块」的窗口也相应变大；调小到 1 会让持续转视角的玩家接近每 tick 一跑。
    cooldown-ticks: 2

    # 扫描半径（格）。默认 24（= 1.5 个区块，覆盖「贴脸看到」的范围）；钳制 8~64。
    # 越界由周期巡检兜底，所以不必为了远处调大——调大只会增加每次取候选的遍历量。
    radius: 24

disk-cache:
  # 磁盘缓存：把已改写完成的区块数据存到 plugins/MikuXrayNet/cache/ 下，重启后可直接复用，
  # 省掉重复的判定与编码 CPU（首次生成的区块收益最明显）。
  # 缓存会随配置或区块内容变化自动失效重写；任何磁盘异常都会自动降级为纯内存运行，不影响正常游戏。
  # 注意：升级插件导致缓存格式变化时，旧缓存会被自动删除重建（属正常现象）。
  enabled: true

  # 缓存条目上限（每条约等于一个区块）。20000 条约占 200~600 MB 磁盘；超出后只是少缓存一些。
  max-entries: 20000

  # 单个区域文件（1024 个区块）的大小上限（MB）。
  # 达到上限后该文件暂不接受新写入，等后台维护压缩回收后继续；若文件里没有垃圾可回收，
  # 该区域剩余的区块就永远进不了缓存（每次重发都要重算一次改写）。
  # 默认 32：单条约 22~26 KB（改写后区块字节 + 坐标表 + 遮挡负载），一个区域文件装满约需
  # 24~27 MB，32 MB 才能装下整区 1024 个区块；配 16 时实测约 1/3 的写入被拒（面板「写入被拒」）。
  max-file-size-mb: 32

  # 磁盘上最多保留多少个区域文件（1 个区域文件 = 32×32 = 1024 个区块的改写结果）。
  # 超出后按「最久未访问」淘汰：先清掉最久没被用到的区域文件，把文件数压回上限。
  # 它与上面的 max-entries 一起界定磁盘占用：max-entries 管「一共缓存多少条区块记录」，
  # 本项管「一共留下多少个区域文件」，谁先到顶就以谁为准。
  # 默认 4096；钳制 16~65536（超出会被钳制并在控制台提示一次）：
  #   下限 16 —— 再小的话缓存刚热起来就被自己的淘汰挤掉，命中率趋近 0（等于白写磁盘）；
  #   上限 65536 —— 已远超正常规模，只用于拦住手滑多打一位数（如 409600）。
  max-region-files: 4096

  # 条目过期秒数：从「写入时刻」开始计时，超过该时间未被复用的条目会被清理。
  # ⚠ 必须大于两次开服的间隔，否则重启后条目必然已过期、命中率恒为 0。
  # 默认 604800（7 天）；安全下限 86400（1 天，低于它会被抬升到 1 天并在控制台提示一次）。
  # 限制磁盘占用请调上面的 max-entries / max-file-size-mb / max-region-files，而不是把本项配短。
  expire-seconds: 604800

  # 每个已打开的区域文件在内存里缓存的区块条目数（1 条 = 1 个区块；缓存的是已解压的槽位数据）。
  # 这是磁盘缓存内存占用的关键旋钮：数值越大读得越快，但驻留内存越多。默认 32（约 4~8 MB/文件）；
  # 上限 64（约 8~16 MB/文件）——再往上抬会让「多文件同时打开」时的驻留内存线性放大。
  # 常驻文件数受 idle-close-seconds（默认 300 秒）与 max-region-files 约束，不是「上限 × 本项」的乘积。
  bucket-cache-size: 32

  # 句柄闲置多久后自动落盘并关闭（秒）：释放文件句柄与内存。
  idle-close-seconds: 300

  # 后台维护周期（秒）：落盘 + 压缩回收 + 关闭闲置句柄。数值越小越及时、开销略高。
  maintenance-interval-seconds: 30

  # 每轮维护最多压缩回收几个区域文件（限制单轮工作量，避免集中占用磁盘）。
  compact-per-pass: 4

  # 磁盘写入队列上限（条）：积压到上限后新的写入被直接丢弃（保网络路径不被拖住）。
  queue-capacity: 256

  # ---------------------------------------------------------------------------
  # zstd 压缩库：磁盘缓存用它压缩数据，缺失时自动回退到内置压缩（功能不受影响，只是压缩率略低）。
  # 开服时按顺序自动寻找：服务端自带 → 本地已下载 → 按下面配置下载 → 内置压缩；
  # 结果会在启动日志里说明（来源：服务端自带 / 新下载 / 回退内置压缩）。
  # ---------------------------------------------------------------------------

  # 缺失时是否自动下载（默认开启）。关闭后只使用服务端自带或本地已有的。
  zstd:
    auto-download: true

    # 下载源（Maven 仓库根地址，末尾不要带 /）。默认 Maven Central。
    # 国内服务器建议改用阿里云镜像：
    #   download-url: https://maven.aliyun.com/repository/public
    # 也可换成 Paper 官方镜像：
    #   download-url: https://maven-central.storage-download.googleapis.com/maven2
    download-url: https://repo1.maven.org/maven2

    # 下载总等待上限（秒）：超时即视为失败并回退内置压缩，不会长时间阻塞开服。
    timeout-seconds: 10

  # 下载文件的 SHA-256 校验（默认留空 = 不校验）。用于防止下载到被篡改或损坏的 jar。
  #   · 留空：跳过校验（旧行为）。插件仍会把本次下载文件的「实际 SHA-256」打印在启动日志里，
  #     你可以直接复制过来填到下面，下次启动即开启校验。
  #   · 填写后：插件只在下载文件的 SHA-256 与你填写的值完全一致时才使用它；不一致就丢弃该文件、
  #     回退内置压缩（功能不受影响，只是压缩率略低），并在控制台提示「期望值」与「实际值」。
  #   · 如何取值：先让插件自动下载一次，复制启动日志里的「实际 SHA-256」；或自行对官方 jar 计算：
  #       Windows：certutil -hashfile zstd-jni-1.5.7-15.jar SHA256
  #       Linux/macOS：sha256sum zstd-jni-1.5.7-15.jar
  #   · 格式：64 位十六进制（大小写均可）。
  #   注意：本项参与缓存指纹，修改后现有磁盘缓存会一次性失效重建（属正常现象）。
  zstd-sha256: ""

cache:
  # 内存缓存（改写结果）的条目上限。每条约占 20~25 KB（按下面的字节记账口径实为 30~50 KB）。
  # 这是上限而非实际占用：条目只在遇到新区块时增长，并按下面的过期时间回收；
  # 内存吃紧就往小调，例如 16384 ≈ 340~800 MB。
  # 上限 65536：防止手滑多打一位数（如 409600）把内存打满；超过会被钳制并提示一次。
  # ⚠ 与下面的 maximum-mb 同时生效、谁先到顶以谁为准：默认 512 MB 会先封顶（按 30~50 KB/条约合
  #   1.0~1.7 万条），因此默认配置下 40960 这个条目上限实际不可达——想缓存更多条目，必须【同时】调大
  #   maximum-mb（只调大本项不会让缓存变多）。
  maximum-size: 40960

  # 内存缓存（改写结果）的【按 MB 的硬上限】，单位 MB。默认 512（即 512 MB）。
  # 与上面的 maximum-size（条目上限）同时生效，谁先到顶以谁为准：
  #   · 条目上限管「最多缓存多少条」，拦住条目数失控；
  #   · MB 上限管「最多占多少内存」，拦住「条目数没超、单条却很大」（直接调色板 / 高熵地形可到几百 KB/条）
  #     导致内存被吃满的情况——真正与堆占用挂钩的是这一项。
  # 超出后按最近最少使用（LRU）淘汰。内存吃紧时优先调小本项（比换算条数更直观）。
  # 默认 512 MB 按 30~50 KB/条约合 1.0~1.7 万条，会先于 maximum-size=40960 到顶（默认配置下的实际
  # 缓存规模由本项决定）；要更多条目请同时调大本项与 maximum-size。
  # 钳制 64 ~ 4096（MB）：低于下限会让缓存事实上关闭（每个区块都重新改写、更耗 CPU），
  # 超出范围会被钳制并在控制台提示一次。
  # 【旧版键名】旧版本这个键叫 cache.maximum-bytes、单位是字节；本版本已改为 cache.maximum-mb，
  # 旧的 maximum-bytes 行会被忽略（按本项默认 512 MB 生效），升级时请删掉旧键。
  maximum-mb: 512

  # 条目在最后一次被使用后多久过期（秒）。默认 600（10 分钟）：
  # 玩家在同一片区域来回走动/挖矿时会持续命中同一批区块，过期时间越长命中率越高，
  # 代价是这些条目在内存里驻留更久。
  # 注：条目过期后由「按 put 摊还的巡检」主动回收（不再只依赖读取命中或容量顶满），
  #     因此长期不再命中的冷条目也会在过期后被释放，实际内存占用会回落到活跃条目规模。
  #     /mikuxraynet status 的条目数只计「未过期」的活跃数；两者之差为尚未被巡检回收的驻留量，
  #     短暂存在属正常现象。
  expire-after-access-seconds: 600

advanced:
  # 运行平台：auto | paper | folia（默认 auto，一般无需修改）。
  # 插件同时支持 Paper 系与 Folia 系服务端，auto 会自动识别并在启动日志说明判定结果；
  # 若你的服务端是改了品牌的衍生端而被识别错，可手工指定。本项同时影响反矿透与带宽两个模块，
  # 修改后执行 /mikuxraynet reload 生效。
  platform: auto

  # 工作线程数；0 表示按 CPU 核数自动推算（上限 4）。
  threads: 0

  # 单个区块包的处理超时（毫秒）。超时立即放行原包，避免客户端卡在加载界面。
  timeout-millis: 2500

  # 工作队列容量（条）。队列满时直接放行原包，不阻塞网络线程。
  queue-capacity: 2048