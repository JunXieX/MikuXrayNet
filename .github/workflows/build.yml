name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile with JDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Publish benchmark report
        if: always()
        run: |
          if [ -f target/benchmark-report.md ]; then
            cat target/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成 target/benchmark-report.md（离线基准未运行到报告步骤）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          retention-days: 1
          path: target/benchmark-report.md
          if-no-files-found: ignore

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: mikuxraynet-jar
          retention-days: 1
          path: target/MikuXrayNet-*.jar
          if-no-files-found: error

      - name: Resolve release info
        if: startsWith(github.ref, 'refs/tags/')
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(python3 -c 'import xml.etree.ElementTree as et; print(et.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 pom.xml 版本 $VER 不一致，或不是正式版本号"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOTES="$(git log -1 --format=%b "$GITHUB_SHA")"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo '::error::发版提交缺少更新日志正文'
            exit 1
          fi
          DELIMITER="$(cat /proc/sys/kernel/random/uuid)"
          {
            echo 'publish=true'
            echo "title=MikuXrayNet $VER"
            echo "notes<<$DELIMITER"
            printf '%s\n' "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.rel.outputs.title }}
          files: target/MikuXrayNet-*.jar
          body: ${{ steps.rel.outputs.notes }}