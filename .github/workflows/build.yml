name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile with JDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Publish benchmark report
        if: always()
        run: |
          if [ -f target/benchmark-report.md ]; then
            cat target/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成 target/benchmark-report.md（离线基准未运行到报告步骤）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          retention-days: 1
          path: target/benchmark-report.md
          if-no-files-found: ignore

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: mikuxraynet-jar
          retention-days: 1
          path: target/MikuXrayNet-*.jar
          if-no-files-found: error

      - name: Resolve release info
        if: startsWith(github.ref, 'refs/tags/')
        id: rel
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "title=MikuXrayNet ${VER}" >> "$GITHUB_OUTPUT"
          # 版本规则（大版本.正式版.测试版）：第三位 > 0 视为测试版（预发布），= 0 为正式版
          PATCH="${VER##*.}"
          case "$PATCH" in
            0) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
          esac
          # 更新日志：取该 tag 所指提交的正文（%(contents:body)；打轻量 tag 时会回落到提交正文）。
          # 约定：发版提交（release: 发布正式版 x.y.z / 测试版）的正文就是本次更新日志。
          # 取不到（例如该提交没有正文）时留空，由下面的 generate_release_notes 兜底——
          # 绝不因为「缺日志」让发布失败，也绝不阻断构建。
          {
            echo 'notes<<MIKUXRAYNET_RELEASE_NOTES_EOF'
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" 2>/dev/null || true
            echo 'MIKUXRAYNET_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.rel.outputs.title }}
          files: target/MikuXrayNet-*.jar
          prerelease: ${{ steps.rel.outputs.prerelease }}
          # 更新日志在前、GitHub 自动生成的变更清单与 Full Changelog 链接附在其后
          body: ${{ steps.rel.outputs.notes }}
          generate_release_notes: true